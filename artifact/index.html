function blobToBase64(blob) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(String(r.result).split(',')[1] || ''); };
    r.onerror = function () { reject(r.error); };
    r.readAsDataURL(blob);
  });
}

// the connector takes ~1 MiB of JSON per call, so shrink anything big first
function shrinkForAi(blob, limit) {
  var LIMIT = limit || 600000;
  if (blob.size <= LIMIT) return Promise.resolve(blob);
  return new Promise(function (resolve) {
    var url = URL.createObjectURL(blob), img = new Image();
    img.onload = function () {
      var scale = Math.max(0.25, Math.sqrt(LIMIT * 0.85 / blob.size));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * scale));
      c.height = Math.max(1, Math.round(img.naturalHeight * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { resolve(b || blob); }, 'image/jpeg', 0.8);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(blob); };
    img.src = url;
  });
}

// groups[i] = the images of one problem; a problem's images always go in the same call
function aiChunks(groups) {
  var chunks = [], cur = [], size = 0;
  groups.forEach(function (g) {
    var gs = g.reduce(function (t, b) { return t + b.size; }, 0);
    if (cur.length && (cur.length >= 5 || size + gs > 650000)) { chunks.push(cur); cur = []; size = 0; }
    cur.push(g); size += gs;
  });
  if (cur.length) chunks.push(cur);
  return chunks;
}

// Gemini sometimes wraps arrays/objects differently than asked; accept the common shapes.
function asList(res, n) {
  if (Array.isArray(res)) return res;
  if (!res || typeof res !== 'object') return null;
  var keys = ['items', 'results', 'problems', 'questions', 'data'];
  for (var i = 0; i < keys.length; i++) if (Array.isArray(res[keys[i]])) return res[keys[i]];
  var all = Object.keys(res);
  for (var j = 0; j < all.length; j++) if (Array.isArray(res[all[j]])) return res[all[j]];
  return n === 1 ? [res] : null;
}

async function aiAsk(prompt, blobs) {
  var images = [];
  for (var i = 0; i < blobs.length; i++) images.push(await blobToBase64(blobs[i]));
  var res = null, lastErr = null;
  var order = GEMINI_SERVERS.slice();
  order.sort(function (a, b) { return (a === GEMINI_SERVER ? 0 : 1) - (b === GEMINI_SERVER ? 0 : 1); });
  for (var si = 0; si < order.length; si++) {
    try {
      res = await mcpFn.callTool(order[si], 'gemini_vision', { prompt: prompt, images: images, mimeType: 'image/jpeg' }, { signal: aiCtl.signal, cache: false });
      GEMINI_SERVER = order[si];
      lastErr = null;
      break;
    } catch (e) {
      lastErr = e;
      var c = e && e.code;
      // only a missing/unselected connector justifies trying the other name
      if (c !== 'server_not_connected' && c !== 'not_in_manifest' && c !== 'server_not_found' && c !== 'selection_required') break;
    }
  }
  if (lastErr) throw lastErr;
  var payload = res && res.payload;
  if (typeof payload === 'string') {
    try { payload = JSON.parse(payload); }
    catch (e) {
      var m = payload.match(/[\[{][\s\S]*[\]}]/);
      try { payload = m ? JSON.parse(m[0]) : null; } catch (e2) { payload = null; }
    }
  }
  if (payload == null || typeof payload !== 'object') throw { code: 'invalid_json', message: 'AI 응답을 읽지 못했어요' };
  return payload;
}

// Returns true when the AI part of the run should stop (the rest is saved without AI text).
function handleAiError(e) {
  var code = e && e.code, msg = String((e && e.message) || '');
  if (code === 'cancelled') return true;
  if (code === 'tool_error' && /429|RESOURCE_EXHAUSTED|rate.?limit|quota|503|UNAVAILABLE|overload/i.test(msg)) {
    aiNote = 'Gemini 한도에 걸려 AI 읽기를 멈췄어요. 나머지는 글자 없이 담았어요.';
    return true;
  }
  if (code === 'server_not_connected' || code === 'selection_required' || code === 'server_not_found') {
    aiNote = '"' + GEMINI_SERVER + '" 커넥터가 연결돼 있지 않아 AI 없이 담았어요. (Claude 설정 → 커넥터)';
    return true;
  }
  if (code === 'needs_reauth') { aiNote = '"' + GEMINI_SERVER + '" 커넥터를 다시 연결해야 해서 AI 없이 담았어요.'; return true; }
  if (code === 'not_in_manifest' || code === 'blocked_by_policy' || code === 'approval_required' || code === 'not_granted' ||
      code === 'capability_disabled' || code === 'capability_removed' || code === 'consent_required') {
    aiNote = 'AI 사용이 허용되지 않아 AI 없이 담았어요.';
    return true;
  }
  aiLastError = (code ? code + ': ' : '') + msg.slice(0, 200);
  aiChunkFails++;
  if (aiChunkFails >= 2) { aiNote = 'AI 연결이 불안정해 읽기를 멈추고 나머지는 글자 없이 담았어요.'; return true; }
  return false;
}

// Fill the problem text and the memo (caption) of the given pending items; fields the user already filled are kept.
async function aiFillPending(items, label) {
  var done = 0;
  var groups = [];
  for (var b = 0; b < items.length; b++) {
    var it0 = items[b];
    var g = [await shrinkForAi(it0.file, it0.readBlob ? 300000 : 600000)];
    if (it0.readBlob) g.push(await shrinkForAi(it0.readBlob, 250000));
    groups.push(g);
  }
  var chunks = aiChunks(groups);
  for (var c = 0; c < chunks.length; c++) {
    if (aiCtl && aiCtl.signal.aborted) return;
    aiProgress = label + (chunks.length > 1 ? ' (' + done + '/' + items.length + ')' : '');
    renderUploadTab();
    var res = null;
    try {
      res = await aiAsk(aiCropPrompt(chunks[c].map(function (g) { return g.length; })), [].concat.apply([], chunks[c]));
    }
    catch (e) {
      if (handleAiError(e)) { aiStopped = true; return; }
      aiFailed += chunks[c].length; done += chunks[c].length; continue;
    }
    var list = asList(res, chunks[c].length);
    for (var j = 0; j < chunks[c].length; j++) {
      var r = list && list[j], it = items[done + j];
      it.readTried = true;
      if (r && typeof r === 'object') {
        var p = String(r.problemText || r.sourceProblemText || '').trim();
        var t = String(r.text || r.conceptText || r.concept || '').trim();
        if (p && !it.problemText) it.problemText = p;
        if (r.coloredInk !== false && t && !it.caption) { it.caption = t; aiReadOk++; }
      } else aiFailed++;
    }
    done += chunks[c].length;
  }
}

// Returns the fields to keep, or a short reason string ('needsReview' when Claude said the material is not enough).
function checkQuestion(r) {
  if (!r || typeof r !== 'object') return '응답 형식이 맞지 않아요';
  if (r.needsReview === true || r.ok === false) return 'needsReview';
  var q = String(r.recallQuestion || '').trim(), a = String(r.recallAnswer || '').trim();
  var keys = Array.isArray(r.keyPoints) ? r.keyPoints.map(function (k) { return String(k).trim(); }).filter(Boolean) : [];
  if (!q || !a) return '질문이나 답이 비어 있어요';
  if (!Q_TYPES[r.questionType]) return '질문 유형이 맞지 않아요';
  if (keys.length < 1 || keys.length > 5) return '핵심 키워드 수가 맞지 않아요';
  if ((q.match(/\?/g) || []).length > 1) return '한 번에 여러 가지를 묻는 질문이에요';
  if (/계산하|구하시오|산출하|금액은 얼마/.test(q)) return '계산을 요구하는 질문이에요';

// list: [{ problemText, conceptText, avoidType }] → one result per entry (fields object or reason string). Throws the sample error.
async function askQuestions(list) {
  var res = await sampleFn.json(questionPrompt(list), { cache: false });
  var arr = asList(res, list.length);
  return list.map(function (x, i) { return checkQuestion(arr && arr[i]); });
}

function questionFailNote(reason) {
  return reason === 'needsReview'
    ? '이 자료만으로는 신뢰할 수 있는 복습 문제를 만들기 어렵습니다. 질문을 직접 작성하거나 원본 텍스트를 수정해 주세요.'
    : '질문을 자동으로 만들지 못했습니다(' + reason + '). 직접 입력하시겠습니까?';
}

function sampleErrorNote(e) {
  var c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') {
    sampleFn = null;   // permanent for this view: hide the buttons, keep manual entry
    return 'Claude 사용이 허용되지 않아 질문을 자동으로 만들 수 없어요. 직접 입력해 주세요.';
  }
  if (c === 'rate_limited') return 'Claude 사용 한도에 걸렸어요. 잠시 뒤 다시 눌러 주세요.';
  if (c === 'session_expired') return '다시 로그인한 뒤 눌러 주세요.';
  return '복습 질문을 만들지 못했습니다. 다시 누르거나 직접 입력해 주세요.';
}

// a question needs both the printed problem and the user's own concept
function canAskQuestion(problemText, conceptText) {
  return !!(sampleFn && String(problemText || '').trim() && String(conceptText || '').trim());
}

// Upload review: make questions for the given pending items (default: every included item that can have one and has none).
async function makeUploadQuestions(localIds) {
  if (!sampleFn || qBusy) return;
  var items = localIds
    ? localIds.map(findPending).filter(Boolean)
    : pendingUploads.filter(function (i) { return i.included && !i.q && canAskQuestion(i.problemText, i.caption); });
  if (!items.length) return;
  qBusy = true;
  renderUploadTab();
  for (var s = 0; s < items.length; s += 8) {
    var part = items.slice(s, s + 8);
    try {
      var out = await askQuestions(part.map(function (it) { return { problemText: it.problemText, conceptText: it.caption, avoidType: it.q && it.q.questionType }; }));
      part.forEach(function (it, k) {
        if (typeof out[k] === 'string') it.qNote = questionFailNote(out[k]);
        else { it.q = out[k]; it.qNote = ''; }
      });
    } catch (e) {
      var note = sampleErrorNote(e);
      part.forEach(function (it) { it.qNote = note; });
      if (e && e.code !== 'upstream_error' && e.code !== 'invalid_json') break;
    }
    renderUploadTab();
  }
  qBusy = false;
  renderUploadTab();
}

function manualUploadQuestion(localId) {
  var it = findPending(localId);
  if (!it) return;
  it.q = { questionType: '', recallQuestion: '', recallAnswer: '', recallKeyPoints: [], edited: true };
  it.qNote = '';
  renderUploadTab();
}
function dropUploadQuestion(localId) {
  var it = findPending(localId);
  if (!it) return;
  it.q = null;
  renderUploadTab();
}
function onQuestionInput(localId, field, value) {
  var it = findPending(localId);
  if (!it || !it.q) return;
  it.q[field] = value;
  it.q.edited = true;
}
function onProblemInput(localId, value) {
  var it = findPending(localId);
  if (it) it.problemText = value;
}

// read one problem again with Gemini (after a failed or empty read)
async function rereadUpload(localId) {
  var it = findPending(localId);
  if (!it || !mcpFn || qBusy) return;
  qBusy = true;
  renderUploadTab();
  aiCtl = new AbortController();
  aiChunkFails = 0;
  try { await aiFillPending([it], ''); } catch (e) {}
  aiCtl = null;
  qBusy = false;
  if (!String(it.problemText || '').trim()) showToast('문제 텍스트를 추출하지 못했습니다');
  renderUploadTab();
}

// Local colour gate. Counts red/blue pen pixels (HSV) on a half-size copy of the page, after removing printed colour:
//  - connected pieces that sit (≥85%) inside text-layer boxes are printed text (e.g. blue problem numbers),
//  - solid blocks, hollow frames and thin straight rules are printed shapes (tabs, boxes, bullets).
// Pages with almost no pen ink left are skipped without any AI call (recall first: the threshold is low).

      for (var zi = 0; zi < zones.length; zi++) { var zz = zones[zi]; if (zx >= zz[0] && zx <= zz[2] && zy >= zz[1] && zy <= zz[3]) { inZone = true; break; } }

    for (var k = 0; k < boxes.length; k++) { var b = boxes[k]; if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3]) return true; }
    return false;

    var stack = [start], comp = [];

      var cur = stack.pop(); comp.push(cur);

    for (j = 0; j < comp.length; j++) {
      var px = comp[j] % w, py = (comp[j] / w) | 0;
      if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
      if (boxes.length && inText(px, py)) ins++;

      else if (Math.min(bw, bh) >= 6 && n / (bw * bh) >= 0.6) printed = true;         // solid block
      else if (Math.min(bw, bh) <= 4 && Math.max(bw, bh) / Math.min(bw, bh) >= 12) printed = true; // straight rule
      else if (bw >= 20 && bh >= 20) {                                                 // hollow frame

        for (j = 0; j < comp.length; j++) {
          var ex = comp[j] % w, ey = (comp[j] / w) | 0;

    if (printed) continue;
    for (j = 0; j < comp.length; j++) { xs.push(comp[j] % w); ys.push((comp[j] / w) | 0); }

// Overlay images on the page (not the page-sized background), as page fractions. Tablet note apps
// export handwriting as one image laid over the page (digital or scanned); null = no usable overlay info.
async function pdfOverlayImages(page) {
  var vp = page.getViewport({ scale: 1 });
  var ol = await page.getOperatorList(), O = pdfjsLib.OPS, U = pdfjsLib.Util;
  var ctm = vp.transform.slice(), stack = [], boxes = [];
  var imgOps = [O.paintImageXObject, O.paintInlineImageXObject, O.paintImageMaskXObject, O.paintSolidColorImageMask, O.paintJpegXObject];
  for (var i = 0; i < ol.fnArray.length; i++) {
    var fn = ol.fnArray[i];
    if (fn === O.save) stack.push(ctm.slice());
    else if (fn === O.restore) { if (stack.length) ctm = stack.pop(); }
    else if (fn === O.transform) ctm = U.transform(ctm, ol.argsArray[i]);
    else if (imgOps.indexOf(fn) >= 0) {
      var pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(function (pt) { return U.applyTransform(pt, ctm); });
      var xs = pts.map(function (q) { return q[0]; }), ys = pts.map(function (q) { return q[1]; });
      boxes.push([Math.max(0, Math.min.apply(null, xs) / vp.width), Math.max(0, Math.min.apply(null, ys) / vp.height),
                  Math.min(1, Math.max.apply(null, xs) / vp.width), Math.min(1, Math.max.apply(null, ys) / vp.height)]);
    }
  }
  var area = function (b) { return Math.max(0, b[2] - b[0]) * Math.max(0, b[3] - b[1]); };

  var overlays = boxes.filter(function (b) { return area(b) < 0.7 && area(b) >= 0.002; });

  if (big.length > 1) return null;
  if (!overlays.length) return big.length === 1 ? [] : null; // [] = bare page image, no overlay
  return overlays;
}

function pageHasColoredInk(ink) { return ink.n >= GATE_MIN_PX; }

// Text-layer boxes as page fractions, used to recognise printed text.
async function pdfTextBoxes(page) {
  var vp = page.getViewport({ scale: 1 });
  var content = await page.getTextContent();
  var out = [];
  content.items.forEach(function (it) {
    if (!it.str || !it.str.trim()) return;
    var tr = pdfjsLib.Util.transform(vp.transform, it.transform);
    var fs = Math.hypot(tr[2], tr[3]) || 10;
    out.push([(tr[4] - 1) / vp.width, (tr[5] - fs - 1) / vp.height, (tr[4] + (it.width || 0) + 1) / vp.width, (tr[5] + fs * 0.25 + 1) / vp.height]);
  });
  return out;
}

// ── Phase 2: split a digital PDF page into problems from its text layer (no AI call) ──
function isPenPx(d, i) {
  var r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
  var mx = Math.max(r, g, b), df = mx - Math.min(r, g, b);
  if (mx < 0.25 || df / mx < 0.35) return false;
  var hue;
  if (mx === r) hue = ((g - b) / df + 6) % 6; else if (mx === g) hue = (b - r) / df + 2; else hue = (r - g) / df + 4;
  hue *= 60;
  return hue < 20 || hue > 335 || (hue > 190 && hue < 260);
}

// Fade everything that is not red/blue pen (black solving ink, printed text) so the AI only sees the memo.
// Uses a looser saturation than the gate so anti-aliased pen edges survive.
function inkFocus(canvas) {
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
  for (var i = 0; i < d.length; i += 4) {
    var r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
    var mx = Math.max(r, g, b), df = mx - Math.min(r, g, b), keep = false;
    if (mx >= 0.25 && df / mx >= 0.15 && df > 0.05) {
      var hue;
      if (mx === r) hue = ((g - b) / df + 6) % 6; else if (mx === g) hue = (b - r) / df + 2; else hue = (r - g) / df + 4;
      hue *= 60;
      keep = hue < 25 || hue > 330 || (hue > 185 && hue < 265);
    }
    if (!keep) { d[i] = 255 - (255 - d[i]) * 0.2; d[i + 1] = 255 - (255 - d[i + 1]) * 0.2; d[i + 2] = 255 - (255 - d[i + 2]) * 0.2; }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

// Memo regions as page fractions {x0,y0,x1,y1}: pen pixels → 6px cells → merge nearby cells.
function memoRegions(ink) {
  var CELL = 6, GROW = 2;
  var w = ink.w, h = ink.h;

  for (i = 0; i < on.length; i++) on[i] = cnt[i] >= 2 ? 1 : 0;
  for (cy = 0; cy < ch; cy++) for (cx = 0; cx < cw; cx++) {
    if (!on[cy * cw + cx]) continue;
    for (var dy = -GROW; dy <= GROW; dy++) for (var dx = -GROW; dx <= GROW; dx++) {
      var ny = cy + dy, nx = cx + dx;

    k++;

    lab[i] = k;
    while (stack.length) {

  }

}

// Problem ranges per column from the PDF text layer. Returns null when the page has no usable text layer.

    var cx0 = Math.max(cr[0], colX0 - 6) / W, cx1 = Math.min(cr[1], colX1 + 6) / W;
    var colFrom = cr[0] / W, colTo = cr[1] / W;
    var bounds = [0].concat(starts.map(function (t) { return Math.max(0, t - 6); })).concat([H]);
    bounds.forEach(function (y0, bi) {
      if (bi === bounds.length - 1) return;
      var y1 = bounds[bi + 1];
      var inRange = ci_items.filter(function (it) { return it.top >= y0 - 1 && it.top < y1; });
      out.push({
        problem: bi > 0, colFrom: colFrom, colTo: colTo, x0: cx0, x1: cx1, y0: y0 / H, y1: y1 / H,
        textBottom: inRange.length ? Math.max.apply(null, inRange.filter(function (it) { return it.top < H * 0.92; }).map(function (it) { return it.bot; }).concat([y0])) / H : y0 / H
      });
    });
  });
  return out.some(function (r) { return r.problem; }) ? out : null;
}

function cropCanvas(src, box) {
  var clamp = function (v) { return Math.min(1000, Math.max(0, v)); };
  var x0 = clamp(Math.min(box[0], box[2]) - AI_BOX_PAD), y0 = clamp(Math.min(box[1], box[3]) - AI_BOX_PAD);
  var x1 = clamp(Math.max(box[0], box[2]) + AI_BOX_PAD), y1 = clamp(Math.max(box[1], box[3]) + AI_BOX_PAD);
  var px = Math.round(x0 / 1000 * src.width), py = Math.round(y0 / 1000 * src.height);
  var pw = Math.max(1, Math.round((x1 - x0) / 1000 * src.width)), ph = Math.max(1, Math.round((y1 - y0) / 1000 * src.height));
  var c = document.createElement('canvas');
  c.width = pw; c.height = ph;
  c.getContext('2d').drawImage(src, px, py, pw, ph, 0, 0, pw, ph);
  return c;
}

function pushPending(blob, caption, included) {
  pendingUploads.push({
    localId: 'p' + (uploadSeq++),
    file: blob,
    url: URL.createObjectURL(blob),
    caption: caption,
    included: included,
  });
}

function pushLocal(blob, readBlob) {
  pushPending(blob, '', true);
  pendingUploads[pendingUploads.length - 1].readBlob = readBlob || null;
  aiLocalCards++;
}

// Red/blue pen pixels from the gate that fall inside a 0-1000 box.
function inkInBox(ink, box) {
  var x0 = Math.min(box[0], box[2]) / 1000 * ink.w, x1 = Math.max(box[0], box[2]) / 1000 * ink.w;
  var y0 = Math.min(box[1], box[3]) / 1000 * ink.h, y1 = Math.max(box[1], box[3]) / 1000 * ink.h;
  var n = 0;
  for (var i = 0; i < ink.n; i++) if (ink.xs[i] >= x0 && ink.xs[i] <= x1 && ink.ys[i] >= y0 && ink.ys[i] <= y1) n++;
  return n;
}

// Problem ranges on a scanned page (no text layer), from the picture alone. Rows of printed ink form lines;
// a problem number is a line at the column's left edge that stands out in at least two ways: taller, coloured
// first glyph, outdented, alone on its line, or extra space above. Handwriting overlays are blanked first, and
// only the left part of each column is read so checkboxes and side notes don't merge into lines.
function scanProblemRanges(pageCanvas, layers) {
  var W = 700, H = Math.round(pageCanvas.height * W / pageCanvas.width);
  var c = document.createElement('canvas');
  c.width = W; c.height = H;
  var ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(pageCanvas, 0, 0, W, H);
  (layers || []).forEach(function (z) { ctx.fillRect(z[0] * W, z[1] * H, (z[2] - z[0]) * W, (z[3] - z[1]) * H); });
  var d = ctx.getImageData(0, 0, W, H).data;
  var ink = new Uint8Array(W * H), col = new Uint8Array(W * H);
  var xL = Math.round(W * 0.04), xR = Math.round(W * 0.92), x, y, i;
  var colCover = new Uint32Array(W);
  for (y = 0; y < H; y++) for (x = xL; x < xR; x++) {
    i = (y * W + x) * 4;
    var mx = Math.max(d[i], d[i + 1], d[i + 2]), sat = mx - Math.min(d[i], d[i + 1], d[i + 2]);
    var coloured = sat > 60 && mx < 245;
    if (mx < 140 || coloured) { ink[y * W + x] = 1; colCover[x]++; if (coloured) col[y * W + x] = 1; }
  }
  // two columns when a near-empty vertical band runs through the middle
  var best = 0, bestMid = -1, run = 0;
  for (x = Math.round(W * 0.35); x <= Math.round(W * 0.65); x++) {
    if (colCover[x] <= 2) { run++; if (run > best) { best = run; bestMid = x - run / 2; } } else run = 0;
  }
  var cols = best >= W * 0.015 ? [[xL, Math.round(bestMid)], [Math.round(bestMid), xR]] : [[xL, xR]];
  var out = [];
  cols.forEach(function (cr) {
    var readTo = cr[0] + Math.round((cr[1] - cr[0]) * 0.55);
    var lines = [], cur = null;
    for (y = 0; y < H; y++) {
      var lx0 = -1, lx1 = -1;
      for (x = cr[0]; x < readTo; x++) if (ink[y * W + x]) { if (lx0 < 0) lx0 = x; lx1 = x; }
      if (lx0 >= 0) {
        if (!cur) cur = { y0: y, y1: y + 1, x0: lx0, x1: lx1 };
        else { cur.y1 = y + 1; cur.x0 = Math.min(cur.x0, lx0); cur.x1 = Math.max(cur.x1, lx1); }
      } else if (cur) { lines.push(cur); cur = null; }
    }
    if (cur) lines.push(cur);
    lines = lines.filter(function (l) { return l.y1 - l.y0 >= 5; }); // underlines and table rules
    if (lines.length < 3) return;
    var hs = lines.map(function (l) { return l.y1 - l.y0; }).sort(function (a, b) { return a - b; }), med = hs[hs.length >> 1];
    var xs0 = lines.map(function (l) { return l.x0; }).sort(function (a, b) { return a - b; }), body = xs0[xs0.length >> 1];
    var starts = [];
    lines.forEach(function (ln, k) {
      var hgt = ln.y1 - ln.y0, gap = ln.y0 - (k ? lines[k - 1].y1 : 0);
      if (ln.y0 < H * 0.08 || ln.y0 > H * 0.93 || hgt > med * 3 || ln.x0 > body + W * 0.02) return;
      var gx1 = Math.min(readTo, ln.x0 + Math.round(med * 1.6)), gi = 0, gc = 0;
      for (var yy = ln.y0; yy < ln.y1; yy++) for (var xx = ln.x0; xx < gx1; xx++) { var p = yy * W + xx; if (ink[p]) { gi++; if (col[p]) gc++; } }
      var score = (hgt >= med * 1.25 ? 1 : 0) + (ln.x0 < body - W * 0.015 ? 1 : 0) + (gi && gc / gi > 0.3 ? 1 : 0) +
        (ln.x1 - ln.x0 < med * 3 ? 1 : 0) + (gap >= med * 1.2 ? 1 : 0);
      if (score >= 2) starts.push(ln.y0);
    });
    if (!starts.length) return;
    var cx0 = W, cx1 = 0;
    for (x = cr[0]; x < cr[1]; x++) if (colCover[x] > 2) { cx0 = Math.min(cx0, x); cx1 = Math.max(cx1, x); }
    if (cx1 <= cx0) { cx0 = cr[0]; cx1 = cr[1]; }
    var bounds = [0].concat(starts.map(function (t) { return Math.max(0, t - 6); })).concat([H]);
    bounds.forEach(function (y0, bi) {
      if (bi === bounds.length - 1) return;
      var y1 = bounds[bi + 1];
      var inRange = lines.filter(function (l) { return l.y0 >= y0 && l.y0 < y1 && l.y0 < H * 0.93; });
      out.push({
        problem: bi > 0, colFrom: cr[0] / W, colTo: cr[1] / W, x0: Math.max(0, cx0 - 4) / W, x1: Math.min(W, cx1 + 4) / W,
        y0: y0 / H, y1: y1 / H, textBottom: (inRange.length ? inRange[inRange.length - 1].y1 : y0) / H
      });
    });
  });
  if (out.length && cols.length === 2) { // a column without numbers still needs a range for its memos
    cols.forEach(function (cr) {
      if (!out.some(function (r) { return r.colFrom === cr[0] / W; })) out.push({ problem: false, colFrom: cr[0] / W, colTo: cr[1] / W, x0: cr[0] / W, x1: cr[1] / W, y0: 0, y1: 1, textBottom: 0.93 });
    });
  }
  return out.some(function (r) { return r.problem; }) ? out : null;
}

// One crop box (0-1000) per problem that has red/blue memos. Memos above a page's first number belong to a
// problem carried over from the previous page, so that strip is cropped on its own. With no ranges at all,
// nearby memos are grouped and cropped with some context above them.
function localCardBoxes(ranges, memos) {
  var groups = [];
  memos.forEach(function (m) {
    var cx = (m.x0 + m.x1) / 2, cy = (m.y0 + m.y1) / 2, hit = null;
    (ranges || []).some(function (r) {
      if (cx >= r.colFrom && cx < r.colTo && cy >= r.y0 && cy < r.y1) { hit = r; return true; }
      return false;
    });
    var g = groups.find(function (q) { return hit ? q.r === hit : (!q.r && cy >= q.y0 - 0.08 && cy <= q.y1 + 0.08); });
    if (!g) { g = { r: hit, x0: 1, y0: 1, x1: 0, y1: 0 }; groups.push(g); }
    g.x0 = Math.min(g.x0, m.x0); g.y0 = Math.min(g.y0, m.y0); g.x1 = Math.max(g.x1, m.x1); g.y1 = Math.max(g.y1, m.y1);
  });
  return groups.map(function (g) {
    var r = g.r, top, bottom, x0, x1;
    if (r) { top = r.y0; bottom = Math.max(r.textBottom, g.y1) + 0.01; x0 = Math.min(r.x0, g.x0); x1 = Math.max(r.x1, g.x1); }
    else { top = Math.max(0, g.y0 - 0.15); bottom = g.y1 + 0.03; x0 = Math.min(0.04, g.x0); x1 = Math.max(0.96, g.x1); }
    return { top: top, card: [x0 * 1000, top * 1000, x1 * 1000, Math.min(1, bottom) * 1000], read: [g.x0 * 1000, g.y0 * 1000, g.x1 * 1000, g.y1 * 1000] };
  }).sort(function (a, b) { return a.top - b.top; });
}

// Split one page into problems without AI and add every problem that has red/blue memos, without text.
async function pushLocalPage(page, pageCanvas, ink, layers) {
  var memos = memoRegions(ink);
  if (!memos.length) return;
  var ranges = null;
  try { ranges = await pdfProblemRanges(page); } catch (e) { ranges = null; }
  if (!ranges) ranges = scanProblemRanges(pageCanvas, layers);
  var boxes = localCardBoxes(ranges, memos);
  for (var i = 0; i < boxes.length; i++) {
    var card = await canvasToBlob(cropCanvas(pageCanvas, boxes[i].card), 0.9);
    // for AI reading: the memo area only, with black/printed ink faded so Gemini sees just the red/blue pen
    var readBlob = aiWanted() ? await canvasToBlob(inkFocus(cropCanvas(pageCanvas, boxes[i].read)), 0.9) : null;
    pushLocal(card, readBlob);
  }
}

function startLocalRun() {
  aiCtl = new AbortController();
  aiSkipped = 0;
  aiGateSkipped = 0;
  aiScanSkipped = 0;
  aiLocalCards = 0;
  aiReadOk = 0; aiFailed = 0; aiChunkFails = 0; aiNote = ''; aiLastError = ''; aiStopped = false;
  uploadStage = 'ai';
}

function finishLocalRun() {
  aiCtl = null;
  uploadStage = 'review';
  renderUploadTab();
}

function stopAi() {
  if (aiCtl) aiCtl.abort();
}

async function onPdfAutoPicked(file) {
  if (!file) return;
  var doc;
  try {
    doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  } catch (e) {
    showToast('PDF를 여는 중 문제가 생겼어요');
    return;
  }
  startLocalRun();
  try {
    for (var n = 1; n <= doc.numPages; n++) {
      if (aiCtl.signal.aborted) break;
      aiProgress = n + ' / ' + doc.numPages + '페이지 문제 나누는 중';
      renderUploadTab();
      var pageCanvas = await renderPdfPageCanvas(doc, n, AI_PAGE_SCALE);
      var textPage = await doc.getPage(n), boxes = [];
      try { boxes = await pdfTextBoxes(textPage); } catch (e) { boxes = []; }
      var layers = null;
      try { layers = await pdfOverlayImages(textPage); } catch (e) { layers = null; }
      var bareScan = false;
      if (layers && !layers.length) { if (boxes.length) layers = null; else bareScan = true; } // pages with a text layer keep the colour rules
      var ink = penInk(pageCanvas, boxes, layers);
      if (!pageHasColoredInk(ink)) { aiGateSkipped++; if (bareScan) aiScanSkipped++; continue; }
      await pushLocalPage(textPage, pageCanvas, ink, layers);
    }
    // optional: read the handwriting with Gemini. Any problem here just leaves the local results as they are.
    if (aiWanted() && !aiCtl.signal.aborted) {
      var fresh = pendingUploads.filter(function (i) { return i.readBlob && !i.readTried; });
      if (fresh.length) await aiFillPending(fresh, '손글씨 ' + fresh.length + '개 글자로 읽는 중');
    }
  } catch (e) {
    // keep whatever was collected
  }
  finishLocalRun();
}

function shiftDay(key, n) {
  var p = key.split('-');
  var d = new Date(+p[0], +p[1] - 1, +p[2] + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// flame grows and shifts from orange toward blue as the streak gets longer
var FLAME_TIERS = [
  { min: 0,  size: 64,  label: '불씨가 꺼졌어요',    c1: '#c7c7cc', c2: '#e5e5ea', core: '#f2f2f7', glow: 0 },
  { min: 1,  size: 70,  label: '작은 불씨',          c1: '#fb923c', c2: '#fdba74', core: '#fef3c7', glow: 2 },
  { min: 3,  size: 84,  label: '타오르는 중',        c1: '#f97316', c2: '#fbbf24', core: '#fef9c3', glow: 5 },
  { min: 7,  size: 98,  label: '활활 타오르는 불꽃', c1: '#ea580c', c2: '#f59e0b', core: '#fef08a', glow: 9 },
  { min: 14, size: 110, label: '맹렬한 불꽃',        c1: '#dc2626', c2: '#f97316', core: '#fde047', glow: 14 },
  { min: 30, size: 122, label: '푸른 불꽃',          c1: '#2563eb', c2: '#06b6d4', core: '#e0f2fe', glow: 20 },
];
function flameTier(streak) {
  var t = FLAME_TIERS[0];
  FLAME_TIERS.forEach(function (x) { if (streak >= x.min) t = x; });
  return t;
}

function flameSvg(tier) {
  var h = Math.round(tier.size * 1.25);
  var glow = tier.glow ? 'filter:drop-shadow(0 0 ' + tier.glow + 'px ' + tier.c1 + ');' : '';
  return '<svg class="flame" viewBox="0 0 64 80" width="' + tier.size + '" height="' + h + '" style="' + glow + '" aria-hidden="true">' +
    '<defs><linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="' + tier.c1 + '"/><stop offset="1" stop-color="' + tier.c2 + '"/></linearGradient></defs>' +
    '<path fill="url(#flameGrad)" d="M32 4C34 18 50 26 50 46C50 62 42 76 32 76C22 76 14 62 14 46C14 38 18 32 22 28C22 36 26 40 28 40C26 28 28 14 32 4Z"/>' +
    '<path fill="' + tier.core + '" d="M32 38C33 46 40 50 40 58C40 66 36 72 32 72C28 72 24 66 24 58C24 50 30 46 32 38Z"/>' +
  '</svg>';
}

function computeStreaks(daySet, today) {
  var current = 0;
  var cursor = daySet[today] ? today : shiftDay(today, -1);
  while (daySet[cursor]) { current++; cursor = shiftDay(cursor, -1); }
  var days = Object.keys(daySet).sort();
  var longest = 0, run = 0, prev = null;
  days.forEach(function (d) {
    run = (prev && shiftDay(prev, 1) === d) ? run + 1 : 1;
    if (run > longest) longest = run;
    prev = d;
  });
  return { current: current, longest: longest };
}

async function renderStatsTab() {
  var el = document.getElementById('content');
  if (!db) {
    el.innerHTML = '<div class="empty-state">' + ICONS.empty + '<p>데이터 저장 기능을 사용할 수 없어요.</p></div>';
    return;
  }
  el.innerHTML = skelStats();
  // each source loads on its own so one failing query can't blank the whole page (page size max is 1000)
  var failed = [];
  async function loadDocs(label, query) {
    try {
      var snap = await query.get();
      return snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    } catch (e) {
      failed.push(label);
      return [];
    }
  }
  var loaded = await Promise.all([
    loadDocs('학습 기록', db.collection('dailyStats').limit(1000)),
    loadDocs('복습 로그', db.collection('reviewLog').orderBy('reviewedAt', 'desc').limit(1000)),
    loadDocs('개념', db.collection('concepts').limit(1000)),
  ]);
  var dailyDocs = loaded[0], logDocs = loaded[1], concepts = loaded[2];
  if (currentTab !== 'stats') return;

  var now = new Date();
  var today = ankiDayKey(now, SRS_CONFIG);

  // a day counts as studied if dailyStats logged any review, or a concept's last review fell on it
  var daySet = {};
  var dayCounts = {};
  dailyDocs.forEach(function (d) {
    var n = Math.max(d.answered || 0, (d.newIntroduced || 0) + (d.reviewsDone || 0));
    if (n > 0) { daySet[d.id] = true; dayCounts[d.id] = n; }
  });
  concepts.forEach(function (c) { if (c.lastReviewedAt) daySet[ankiDayKey(new Date(c.lastReviewedAt), SRS_CONFIG)] = true; });
  var streaks = computeStreaks(daySet, today);
  var tier = flameTier(streaks.current);
  var note = streaks.current === 0 ? '오늘 복습하면 불꽃이 켜져요.'
    : daySet[today] ? '오늘 복습 완료. 내일도 이어가요.'
    : '오늘 복습하면 ' + (streaks.current + 1) + '일째가 돼요.';

  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function weekdayOf(key) { var p = key.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }
  var week = '';
  for (var i = 6; i >= 0; i--) {
    var k = shiftDay(today, -i);
    var on = !!daySet[k];
    week += '<div class="week-day' + (on ? ' on' : '') + (i === 0 ? ' today' : '') + '">' + WD[weekdayOf(k)] +
      '<div class="week-dot">' + (on ? '<svg viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') + '</div></div>';
  }

  // recall rate per subject over the retained review log (좋음/쉬움 = recalled)
  var subjectOf = {};
  concepts.forEach(function (c) { subjectOf[c.id] = canonSubjectId(c.subjectId); });
  var bySubject = {};
  logDocs.forEach(function (r) {
    var sid = subjectOf[r.conceptId];
    if (!sid) return;
    var b = bySubject[sid] || (bySubject[sid] = { total: 0, ok: 0 });
    b.total++;
    if (r.rating === 'good' || r.rating === 'easy') b.ok++;
  });
  var accRows = SUBJECTS.filter(function (s) { return bySubject[s.id] && bySubject[s.id].total >= 3; }).map(function (s) {
    var b = bySubject[s.id];
    var pct = Math.round(b.ok / b.total * 100);
    return '<div class="acc-row clickable" onclick="openConcepts(\'' + s.group + '\', \'' + s.id + '\', \'hard\')" title="이 과목의 어려운 개념 보기"><span class="acc-name">' + s.name + '</span>' +
      '<div class="acc-track"><div class="acc-fill" style="width:' + pct + '%;background:' + s.c1 + '"></div></div>' +
      '<span class="acc-val">' + pct + '% · ' + b.total + '회</span></div>';
  }).join('');

  // 오래된 카드 기억률: 복습 직전 간격이 21일 이상이었던 복습만 따로 센다 (좋음·쉬움 = 기억함)
  var oldTotal = 0, oldOk = 0, allRevTotal = 0, allRevOk = 0;
  logDocs.forEach(function (r) {
    if (r.stateBefore !== 'review') return;
    var ok = r.rating === 'good' || r.rating === 'easy';
    allRevTotal++; if (ok) allRevOk++;
    if ((r.intervalBefore || 0) >= 21) { oldTotal++; if (ok) oldOk++; }
  });
  var matureCount = concepts.filter(function (c) { return c.state === 'review' && (c.intervalDays || 0) >= 21; }).length;
  var oldCard = '<div class="stat-card"><h2 class="stat-title">오래된 카드 기억률 (간격 3주 이상, 최근 30일)</h2>' +
    (oldTotal
      ? '<div class="old-recall"><div class="old-pct">' + Math.round(oldOk / oldTotal * 100) + '<small>%</small></div>' +
        '<div class="old-desc"><div>' + oldTotal + '번 복습 중 ' + oldOk + '번 기억했어요</div>' +
        '<div class="old-sub">복습 카드 전체 기억률 ' + Math.round(allRevOk / allRevTotal * 100) + '% · 지금 3주 이상 간격 카드 ' + matureCount + '개</div></div></div>'
      : '<div class="stat-empty">간격이 3주 이상 벌어진 카드를 복습하면 기억률이 나타나요. 지금 3주 이상 간격 카드는 ' + matureCount + '개예요.</div>') +
    '</div>';

  // reviews due per day for the next 7 days; overdue and learning cards count toward today
  var dueKeys = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return shiftDay(today, i); });
  var due = [0, 0, 0, 0, 0, 0, 0];
  concepts.forEach(function (c) {
    if (!c.nextReviewDate) return;
    var dk = ankiDayKey(new Date(c.nextReviewDate), SRS_CONFIG);
    if (dk < today) dk = today;
    var idx = dueKeys.indexOf(dk);
    if (idx >= 0) due[idx]++;
  });
  var maxDue = Math.max.apply(null, due.concat([1]));
  var dueCols = due.map(function (n, i) {
    var label = i === 0 ? '오늘' : i === 1 ? '내일' : WD[weekdayOf(dueKeys[i])];
    return '<div class="due-col"><span class="due-n">' + n + '</span>' +
      '<div class="due-bar' + (n === 0 ? ' zero' : '') + '" style="height:' + Math.round(n / maxDue * 86) + 'px"></div>' +
      '<span class="due-d">' + label + '</span></div>';
  }).join('');

  // heatmap: last 16 weeks, one column per week starting Sunday
  var todayWd = weekdayOf(today);
  var heatStart = shiftDay(today, -(15 * 7 + todayWd));
  var heatCells = '', heatTotal = 0;
  for (var hk = heatStart; hk <= today; hk = shiftDay(hk, 1)) {
    var hn = dayCounts[hk] || (daySet[hk] ? 1 : 0);
    heatTotal += hn;
    var lvl = hn === 0 ? 0 : hn < 5 ? 1 : hn < 15 ? 2 : hn < 30 ? 3 : 4;
    var hp = hk.split('-');
    heatCells += '<div class="heat-cell' + (lvl ? ' l' + lvl : '') + (hk === today ? ' today' : '') + '" title="' + (+hp[1]) + '월 ' + (+hp[2]) + '일 · ' + hn + '회"></div>';
  }
  var heatCard = '<div class="stat-card"><h2 class="stat-title">학습 달력 (최근 16주)</h2>' +
    '<div class="heat-wrap" id="heatWrap"><div class="heat-grid">' + heatCells + '</div></div>' +
    '<div class="heat-foot"><span>' + heatTotal + '회 복습</span><span class="heat-legend">적음 ' +
    '<div class="heat-cell"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l3"></div><div class="heat-cell l4"></div> 많음</span></div></div>';

  // study time: today, per-card average over days that recorded time, and the last 7 days
  function fmtDuration(ms) {
    var sec = Math.round(ms / 1000);
    if (sec < 60) return sec + '초';
    var min = Math.round(sec / 60);
    return min < 60 ? min + '분' : Math.floor(min / 60) + '시간 ' + (min % 60) + '분';
  }
  var msByDay = {}, timedMs = 0, timedCards = 0;
  dailyDocs.forEach(function (d) {
    if (d.studyMs > 0) {
      msByDay[d.id] = d.studyMs;
      if (d.id >= shiftDay(today, -6)) { timedMs += d.studyMs; timedCards += d.answered || 0; }
    }
  });
  var timeKeys = [6, 5, 4, 3, 2, 1, 0].map(function (i) { return shiftDay(today, -i); });
  var maxMs = Math.max.apply(null, timeKeys.map(function (k) { return msByDay[k] || 0; }).concat([1]));
  var timeCols = timeKeys.map(function (k, i) {
    var ms = msByDay[k] || 0;
    return '<div class="due-col"><span class="due-n">' + (ms ? Math.max(1, Math.round(ms / 60000)) : 0) + '</span>' +
      '<div class="due-bar' + (ms ? '' : ' zero') + '" style="height:' + Math.round(ms / maxMs * 86) + 'px"></div>' +
      '<span class="due-d">' + (i === 6 ? '오늘' : WD[weekdayOf(k)]) + '</span></div>';
  }).join('');
  var timeCard =
    '<div class="mini-stats">' +
      '<div class="mini-stat"><div class="v">' + (msByDay[today] ? fmtDuration(msByDay[today]) : '0분') + '</div><div class="l">오늘 학습 시간</div></div>' +
      '<div class="mini-stat"><div class="v">' + (timedCards ? fmtDuration(timedMs / timedCards) : '-') + '</div><div class="l">카드당 평균 (최근 7일)</div></div>' +
    '</div>' +
    '<div class="stat-card"><h2 class="stat-title">하루 학습 시간 (분)</h2><div class="due-chart">' + timeCols + '</div>' +
    (Object.keys(msByDay).length ? '' : '<div class="stat-empty" style="margin-top:10px">시간 기록은 이번 업데이트 이후 복습부터 쌓여요.</div>') + '</div>';

  // maturity: how settled the concepts are (young = interval under 21 days)
  var mat = { newC: 0, learning: 0, young: 0, mature: 0 };
  concepts.forEach(function (c) {
    var n = normalizeCard(c, SRS_CONFIG);
    if (n.state === 'new') mat.newC++;
    else if (n.state === 'learning' || n.state === 'relearning') mat.learning++;
    else if (n.intervalDays < 21) mat.young++;
    else mat.mature++;
  });
  var matDefs = [
    { key: 'newC', label: '새 카드', color: '#3b82f6' },
    { key: 'learning', label: '학습 중', color: '#f87171' },
    { key: 'young', label: '어린 카드', color: '#fbbf24' },
    { key: 'mature', label: '숙성 카드', color: '#22c55e' },
  ];
  var matCard = '<div class="stat-card">' + statHead('개념 성숙도', mat.newC > 0 ? '새 카드 ' + mat.newC + '개 복습하기' : '', "switchTab('review')") +
    (concepts.length
      ? '<div class="mature-bar">' + matDefs.map(function (m) {
          return mat[m.key] ? '<div class="mature-seg" style="width:' + (mat[m.key] / concepts.length * 100) + '%;background:' + m.color + '"></div>' : '';
        }).join('') + '</div>' +
        '<div class="mature-legend">' + matDefs.map(function (m) {
          return '<span class="k"><i style="background:' + m.color + '"></i>' + m.label + '<b>' + mat[m.key] + '</b></span>';
        }).join('') + '</div>'
      : '<div class="stat-empty">개념을 추가하면 성숙도가 나타나요.</div>') +
    '</div>';

  // weak concepts: most lapses (pressed 다시 on a review card)
  var weak = concepts.map(function (c) { return { c: c, lapses: c.lapses || 0 }; })
    .filter(function (w) { return w.lapses > 0; })
    .sort(function (a, b) { return b.lapses - a.lapses; })
    .slice(0, 5);
  var weakCard = '<div class="stat-card">' + statHead('자주 틀리는 개념 TOP 5', weak.length ? '전체 보기' : '', "openConcepts('', '', 'hard')") +
    (weak.length ? weak.map(function (w) {
      var subj = findSubject(w.c.subjectId);
      var url = w.c.imageId ? '/_blob/' + w.c.imageId : '';
      return '<div class="weak-row">' +
        (url ? '<img class="weak-thumb" src="' + url + '" alt="개념" onclick="openLightbox(\'' + url + '\')">' : '<div class="weak-thumb"></div>') +
        '<div class="weak-body"><div class="weak-subj" style="color:' + (subj ? subj.c1 : 'var(--text-3)') + '">' + (subj ? (subj.isGroupOnly ? subj.groupName : subj.name) : '') + '</div>' +
        '<div class="weak-text">' + (w.c.text ? escapeHtml(w.c.text) : '메모 없음') + '</div></div>' +
        '<span class="weak-count">다시 ' + w.lapses + '회</span></div>';
    }).join('') : '<div class="stat-empty">복습 중 "다시"를 누른 개념이 아직 없어요.</div>') +
    '</div>';

  var warn = failed.length ? '<div class="stat-card stat-warn">' + failed.join(', ') + '을(를) 불러오지 못했어요. 잠시 뒤 통계 탭을 다시 열어 주세요.</div>' : '';
  el.innerHTML = warn +
    '<div id="examBanner"><div id="examHero" class="exam-hero" onclick="toggleExamEditor()"></div><div id="examEditor"></div></div>' +
    '<div class="stat-card">' +
      '<div class="streak-hero">' +
        '<div class="flame-wrap">' + flameSvg(tier) + '</div>' +
        '<div><div class="streak-num">' + streaks.current + '<small>일 연속</small></div>' +
        '<div class="streak-tier" style="color:' + tier.c1 + '">' + tier.label + '</div>' +
        '<div class="streak-note">' + note + '</div>' +
        (daySet[today] ? '' : '<button class="btn-primary" style="margin-top:10px;width:auto;padding:9px 18px" onclick="switchTab(\'review\')">지금 복습하기</button>') + '</div>' +
      '</div>' +
      '<div class="week-row">' + week + '</div>' +
    '</div>' +
    '<div class="mini-stats">' +
      '<div class="mini-stat"><div class="v">' + streaks.longest + '일</div><div class="l">최장 연속</div></div>' +
      '<div class="mini-stat"><div class="v">' + concepts.length + '개</div><div class="l">저장한 개념</div></div>' +
    '</div>' +
    heatCard + timeCard + matCard + oldCard +
    '<div class="stat-card">' + statHead('과목별 기억률 (최근 30일)', accRows ? '어려운 순으로 보기' : '', "openConcepts('', '', 'hard')") +
      (accRows || '<div class="stat-empty">한 과목을 3번 이상 복습하면 기억률(좋음·쉬움 비율)이 나타나요.</div>') +
    '</div>' +
    '<div class="stat-card">' + statHead('앞으로 7일 복습 예정', due[0] > 0 ? '오늘 ' + due[0] + '개 복습하기' : '', "switchTab('review')") + '<div class="due-chart">' + dueCols + '</div></div>' + weakCard;
  renderExamEditor();
  renderExamBanner();
  var heatEl = document.getElementById('heatWrap');
  if (heatEl) heatEl.scrollLeft = heatEl.scrollWidth;
}

/* ───────────────── concepts tab (모아보기) ───────────────── */

async function renderConceptsTab() {
  var el = document.getElementById('content');
  if (!db) {
    el.innerHTML = '<div class="empty-state">' + ICONS.empty + '<p>데이터 저장 기능을 사용할 수 없어요.</p></div>';
    return;
  }
  if (allConcepts === null) {
    el.innerHTML = skelCards(6);
    try {
      var snap = await db.collection('concepts').limit(1000).get();
      allConcepts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      allConcepts.sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
    } catch (e) {
      allConcepts = null;
      if (currentTab === 'concepts') el.innerHTML = errorBox('개념을 불러오지 못했어요', 'renderConceptsTab()');
      return;
    }
    // 카운터가 생기기 전 복습도 반영: 복습 기록의 다시/어려움 횟수와 카운터 중 큰 값을 쓴다
    try {
      var logSnap = await db.collection('reviewLog').limit(1000).get();
      var again = {}, hard = {};
      logSnap.docs.forEach(function (d) {
        var r = d.data();
        if (r.rating === 'again') again[r.conceptId] = (again[r.conceptId] || 0) + 1;
        else if (r.rating === 'hard') hard[r.conceptId] = (hard[r.conceptId] || 0) + 1;
      });
      allConcepts.forEach(function (c) {
        c._again = Math.max(c.againCount !== undefined ? c.againCount : (c.lapses || 0), again[c.id] || 0);
        c._hard = Math.max(c.hardCount || 0, hard[c.id] || 0);
      });
    } catch (e) {}
  }
  if (currentTab !== 'concepts') return;

  el.innerHTML =
    '<div class="concept-toolbar">' +
      '<div class="toolbar-row">' +
        '<input type="search" id="conceptSearch" class="search-input" placeholder="메모 검색" value="' + escapeHtml(conceptsSearch) + '" autocomplete="off">' +
        '<div class="seg" id="sortSeg" role="group" aria-label="정렬 기준"></div>' +
        '<div class="seg" id="dirSeg" role="group" aria-label="정렬 방향"></div>' +
        '<span class="sort-hint" id="sortHint"></span>' +
        '<button class="btn-secondary sel-toggle" onclick="toggleSelectMode()">' + (selectMode ? '선택 끝내기' : '여러 개 선택') + '</button>' +
      '</div>' +
      '<div id="subjectChips" role="group" aria-label="과목"></div>' +
    '</div><div id="galleryResults"></div><div id="selBar"></div>';
  document.getElementById('conceptSearch').addEventListener('input', function (e) {
    conceptsSearch = e.target.value;
    renderGalleryResults();
  });
  renderConceptControls();
  renderGalleryResults();
  renderSelBar();
}

function toggleSelectMode() {
  selectMode = !selectMode;
  selectedIds = {};
  renderConceptsTab();
}
function selCount() { return Object.keys(selectedIds).filter(function (k) { return selectedIds[k]; }).length; }
function renderSelBar() {
  var bar = document.getElementById('selBar');
  if (!bar) return;
  if (!selectMode) { bar.innerHTML = ''; return; }
  bar.innerHTML = '<div class="sel-bar"><span><b id="selN">' + selCount() + '</b>개 선택</span>' +
    '<button class="btn-secondary" onclick="selectAllVisible()">보이는 것 전체</button>' +
    '<select id="selTarget"><option value="" selected disabled>세부 과목 고르기</option>' +
    GROUPS.map(function (g) {
      return '<optgroup label="' + g.name + '"><option value="' + g.id + '">' + g.name + ' · 미지정</option>' + g.subs.map(function (s) {
        return '<option value="' + s[0] + '">' + s[1] + '</option>';
      }).join('') + '</optgroup>';
    }).join('') + '</select>' +
    '<button class="btn-primary" onclick="applySelSubject()">지정</button></div>';
}
function toggleSel(id, on) {
  selectedIds[id] = !!on;
  var n = document.getElementById('selN');
  if (n) n.textContent = selCount();
}
function selectAllVisible() {
  lastFiltered.forEach(function (c) { selectedIds[c.id] = true; });
  renderGalleryResults();
  var n = document.getElementById('selN');
  if (n) n.textContent = selCount();
}
async function applySelSubject() {
  var sel = document.getElementById('selTarget');
  var v = sel ? sel.value : '';
  var ids = Object.keys(selectedIds).filter(function (k) { return selectedIds[k]; });
  if (!v) { showToast('지정할 과목을 먼저 골라 주세요'); return; }
  if (!ids.length) { showToast('개념을 먼저 선택해 주세요'); return; }
  try {
    await Promise.all(ids.map(function (id) { return db.doc('concepts/' + id).update({ subjectId: v }); }));
  } catch (e) {
    showToast('일부를 저장하지 못했어요. 다시 불러올게요');
    allConcepts = null; selectedIds = {};
    renderConceptsTab();
    return;
  }
  allConcepts.forEach(function (c) { if (selectedIds[c.id]) c.subjectId = v; });
  var sj = findSubject(v);
  studyInfo = null; selectedIds = {}; selectMode = false;
  showToast(ids.length + '개를 ' + (sj ? (sj.isGroupOnly ? sj.groupName + ' · 미지정' : sj.name) : '') + '(으)로 지정했어요');
  renderConceptsTab();
}

// subject chips and the sort switch act together on the list below
function renderConceptControls() {
  var seg = document.getElementById('sortSeg'), chips = document.getElementById('subjectChips');
  if (!seg || !chips) return;
  renderSeg(seg, [['new', '최신순'], ['hard', '어려운 순']], conceptsSort, 'setConceptsSort');
  renderSeg(document.getElementById('dirSeg'), [['desc', '내림차순 ↓'], ['asc', '오름차순 ↑']], conceptsDir, 'setConceptsDir');
  var hint = document.getElementById('sortHint');
  if (hint) hint.textContent = conceptsSort === 'new'
    ? (conceptsDir === 'desc' ? '가장 최근에 올린 것부터' : '가장 오래전에 올린 것부터')
    : (conceptsDir === 'desc' ? '다시·어려움을 많이 누른 것부터' : '다시·어려움을 적게 누른 것부터');
  var key = conceptsGroup + '|' + conceptsSubjectFilter;
  if (chips.dataset.sel === key && chips.children.length) return;   // 선택이 안 바뀌면 칩을 다시 그리지 않아 애니메이션이 한 번만 나옴
  chips.dataset.sel = key;
  function chip(label, on, js, color) {
    return '<button class="filter-chip' + (on ? ' on' : '') + '" onclick="' + js + '">' + (color ? '<i style="background:' + color + '"></i>' : '') + label + '</button>';
  }
  var g = GROUPS.find(function (x) { return x.id === conceptsGroup; });
  chips.innerHTML = '<div class="chip-scroll">' + chip('전체', conceptsGroup === '', "setConceptsGroup('')") +
    GROUPS.map(function (x) { return chip(x.name, conceptsGroup === x.id, "setConceptsGroup('" + x.id + "')", x.color); }).join('') + '</div>' +
    (g ? '<div class="chip-scroll" style="margin-top:6px">' + chip(g.name + ' 전체', conceptsSubjectFilter === '', "setConceptsSubject('')", g.color) +
      chip('세부 미지정', conceptsSubjectFilter === g.id, "setConceptsSubject('" + g.id + "')", g.color) +
      g.subs.map(function (s) { return chip(s[1], conceptsSubjectFilter === s[0], "setConceptsSubject('" + s[0] + "')", g.color); }).join('') + '</div>' : '');
}
// 버튼은 한 번만 만들고 .on 과 슬라이드 알약만 옮겨서, 전환이 부드럽게 미끄러지게 한다
function renderSeg(seg, opts, current, handler) {
  if (!seg) return;
  if (!seg.querySelector('button')) {
    seg.innerHTML = '<span class="seg-pill"></span>' + opts.map(function (o) {
      return '<button data-v="' + o[0] + '" onclick="' + handler + '(\'' + o[0] + '\')">' + o[1] + '</button>';
    }).join('');
  }
  seg.querySelectorAll('button').forEach(function (b) {
    var on = b.dataset.v === current;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
  var place = function () {
    var on = seg.querySelector('button.on'), pill = seg.querySelector('.seg-pill');
    if (!on || !pill) return;
    pill.style.width = on.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + on.offsetLeft + 'px)';
  };
  place();
  requestAnimationFrame(place);
}
function setConceptsSort(v) {
  conceptsSort = v;
  try { localStorage.setItem('conceptsSort', v); } catch (e) {}
  renderConceptControls();
  renderGalleryResults();
}
function setConceptsDir(v) {
  conceptsDir = v;
  try { localStorage.setItem('conceptsDir', v); } catch (e) {}
  renderConceptControls();
  renderGalleryResults();
}
function setConceptsGroup(v) {
  conceptsGroup = v;
  conceptsSubjectFilter = '';
  renderConceptControls();
  renderGalleryResults();
}
function openConcepts(group, sub, sort, dir) {   // 홈·통계에서 모아보기를 특정 과목/정렬로 열기
  conceptsGroup = group || '';
  conceptsSubjectFilter = sub || '';
  conceptsSearch = '';
  selectMode = false; selectedIds = {};
  if (sort) { conceptsSort = sort; conceptsDir = dir || 'desc'; }
  switchTab('concepts');
}
function setConceptsSubject(v) {
  conceptsSubjectFilter = v;
  renderConceptControls();
  renderGalleryResults();
}

// 다시 + 어려움 presses; cards from before the counters existed fall back to their lapses
function againOf(c) { return c._again !== undefined ? c._again : (c.againCount !== undefined ? c.againCount : (c.lapses || 0)); }
function hardOf(c) { return c._hard !== undefined ? c._hard : (c.hardCount || 0); }
function hardScore(c) { return againOf(c) + hardOf(c); }

// Wraps each search word found in the raw text in <mark>, escaping everything else.
function highlightText(text, tokens) {
  if (!tokens.length) return escapeHtml(text);
  var re = new RegExp('(' + tokens.map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')', 'gi');
  return text.split(re).map(function (part, i) { return i % 2 ? '<mark>' + escapeHtml(part) + '</mark>' : escapeHtml(part); }).join('');
}

function renderGalleryResults() {
  var resultsEl = document.getElementById('galleryResults');
  if (!resultsEl) return;
  var tokens = conceptsSearch.toLowerCase().split(/\s+/).filter(Boolean);
  var filtered = allConcepts.filter(function (c) {
    var sj = findSubject(c.subjectId);
    if (conceptsGroup && (!sj || sj.group !== conceptsGroup)) return false;
    if (conceptsSubjectFilter && (!sj || sj.id !== conceptsSubjectFilter)) return false;
    var text = (c.text || '').toLowerCase();
    return tokens.every(function (t) { return text.indexOf(t) !== -1; });
  });
  // subject filter and sort work together: filter first, then order what is left
  filtered = filtered.slice().sort(function (a, b) {
    var sign = conceptsDir === 'asc' ? -1 : 1;
    if (conceptsSort === 'hard') {
      var d = hardScore(b) - hardScore(a);
      if (d) return d * sign;
      return (b.createdAt || '').localeCompare(a.createdAt || '');   // 같은 횟수면 최신 먼저
    }
    return (b.createdAt || '').localeCompare(a.createdAt || '') * sign;
  });

  lastFiltered = filtered;
  if (filtered.length === 0) {
    resultsEl.innerHTML = tokens.length
      ? emptyBox(ICONS.empty, '검색 결과가 없어요', '다른 단어로 찾아보세요.', '')
      : (conceptsGroup || conceptsSubjectFilter)
      ? emptyBox(ICONS.empty, '이 과목엔 아직 개념이 없어요', '문제를 올리면 여기에 쌓여요.', '<button class="btn-primary" onclick="switchTab(\'upload\')">문제 올리기</button>')
      : emptyBox(ICONS.empty, '저장된 개념이 없어요', '문제를 올리면 여기에 모여요.', '<button class="btn-primary" onclick="switchTab(\'upload\')">문제 올리기</button>');
    return;
  }
  resultsEl.innerHTML = '<div class="search-count">' + (tokens.length ? '검색 결과 ' : '') + filtered.length + '개</div>' + '<div class="gallery-grid">' + filtered.map(function (c) {
    var url = c.imageId ? ('/_blob/' + c.imageId) : '';
    return '<div class="gallery-item">' +
      (url ? '<div class="g-img"><img src="' + url + '" alt="개념" onclick="openLightbox(\'' + url + '\')"></div>' : '') +
      '<div class="g-body">' +
        (selectMode ? '<label class="g-sel"><input type="checkbox"' + (selectedIds[c.id] ? ' checked' : '') + ' onchange="toggleSel(\'' + c.id + '\', this.checked)"> 선택</label>' : '') +
        (hardScore(c) > 0 ? '<div class="g-hard">다시 ' + againOf(c) + '회 · 어려움 ' + hardOf(c) + '회</div>' : '') +
        '<div class="g-top">' + subjectEditor(c.id, c.subjectId) +
          '<button class="btn-icon" onclick="deleteConcept(\'' + c.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg></button>' +
        '</div>' +
        (editingConceptId === c.id
          ? '<textarea class="g-caption-edit" onblur="saveEditCaption(\'' + c.id + '\', this.value)">' + escapeHtml(c.text || '') + '</textarea>'
          : '<div class="g-caption" onclick="startEditCaption(\'' + c.id + '\')">' + (c.text ? highlightText(c.text, tokens) : '메모 추가...') + '</div>') +
        galleryQuestionHtml(c) +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

// 모아보기: 복습 질문 보기·직접 수정·다시 만들기. 질문 필드만 바꾸고 복습 기록은 그대로 둔다.
function galleryQuestionHtml(c) {
  var id = c.id, busy = galleryQBusy === id, dis = galleryQBusy ? ' disabled' : '';
  var can = canAskQuestion(c.sourceProblemText, c.text);
  var note = galleryQNote[id] ? '<div class="q-note">' + escapeHtml(galleryQNote[id]) + '</div>' : '';
  if (editingQuestionId === id) {
    var src = questionDraft || c;
    return '<div class="q-box"><div class="field-label">복습 질문' + (Q_TYPES[src.questionType] ? ' · ' + Q_TYPES[src.questionType] : '') + (questionDraft ? ' (새로 만든 질문, 저장해야 반영돼요)' : '') + '</div>' +
      '<textarea id="qeQ">' + escapeHtml(src.recallQuestion || '') + '</textarea>' +
      '<div class="field-label">답</div><textarea id="qeA">' + escapeHtml(src.recallAnswer || '') + '</textarea>' + note +
      '<div class="q-btns"><button class="btn-primary" onclick="saveEditQuestion(\'' + id + '\')">저장</button><button class="btn-secondary" onclick="cancelEditQuestion()">취소</button></div></div>';
  }
  return '<div class="q-box">' +
    (c.recallQuestion ? '<div class="g-q"><b>복습 질문</b>' + escapeHtml(c.recallQuestion) + '</div><div class="g-q"><b>답</b>' + escapeHtml(c.recallAnswer || '') + '</div>' : '') +
    (busy ? '<div class="q-note">자기 전 복습 문제를 만드는 중입니다…</div>' : note) +
    '<div class="q-btns"><button class="btn-secondary" onclick="startEditQuestion(\'' + id + '\')"' + dis + '>' + (c.recallQuestion ? '질문 수정' : '질문 직접 입력') + '</button>' +
      (can ? '<button class="btn-secondary" onclick="regenConceptQuestion(\'' + id + '\')"' + dis + '>' + (c.recallQuestion ? '질문 다시 만들기' : '질문 만들기') + '</button>' : '') +
    '</div></div>';
}

function startEditQuestion(id) {
  editingQuestionId = id;
  questionDraft = null;
  galleryQNote[id] = '';
  renderGalleryResults();
}
function cancelEditQuestion() {
  editingQuestionId = null;
  questionDraft = null;
  renderGalleryResults();
}

async function regenConceptQuestion(id) {
  var c = allConcepts.find(function (x) { return x.id === id; });
  if (!c || galleryQBusy || !canAskQuestion(c.sourceProblemText, c.text)) return;
  galleryQBusy = id;
  galleryQNote[id] = '';
  renderGalleryResults();
  try {
    var r = (await askQuestions([{ problemText: c.sourceProblemText, conceptText: c.text, avoidType: c.questionType }]))[0];
    if (typeof r === 'string') galleryQNote[id] = questionFailNote(r);
    else { editingQuestionId = id; questionDraft = r; }   // shown for approval; nothing is saved until "저장"
  } catch (e) { galleryQNote[id] = sampleErrorNote(e); }
  galleryQBusy = null;
  renderGalleryResults();
}

async function saveEditQuestion(id) {
  var q = (document.getElementById('qeQ') || {}).value || '', a = (document.getElementById('qeA') || {}).value || '';
  if (!q.trim() || !a.trim()) { showToast('질문과 답을 모두 적어 주세요'); return; }
  var c = allConcepts.find(function (x) { return x.id === id; }) || {};
  var base = questionDraft || { questionType: c.questionType, recallKeyPoints: c.recallKeyPoints, generatedAt: c.questionGeneratedAt, recallQuestion: c.recallQuestion, recallAnswer: c.recallAnswer };
  var edited = !questionDraft || q.trim() !== base.recallQuestion || a.trim() !== base.recallAnswer;
  var fields = questionFields(Object.assign({}, base, { recallQuestion: q, recallAnswer: a, edited: edited }));
  try {
    await db.doc('concepts/' + id).update(fields);
  } catch (e) {
    showToast('저장 실패');
    return;
  }
  Object.assign(c, fields);
  editingQuestionId = null;
  questionDraft = null;
  reviewQueue = null;   // 복습 큐가 바뀐 질문으로 다시 불러오게 함
  waitingQueue = [];
  renderGalleryResults();
}

async function deleteConcept(id) {
  var concept = allConcepts.find(function (c) { return c.id === id; });
  if (!concept) return;
  if (assets && concept.imageId) {
    try { await assets.delete(concept.imageId); } catch (e) {} // 자산 삭제 실패는 무시 — 개념 문서 삭제가 핵심
  }
  try {
    await db.doc('concepts/' + id).delete();
  } catch (e) {
    showToast('삭제 실패, 다시 눌러주세요');
    return;
  }
  allConcepts = allConcepts.filter(function (c) { return c.id !== id; });
  studyInfo = null;
  reviewQueue = null;
  waitingQueue = [];
  renderGalleryResults();
}

initCapabilities();
</script>

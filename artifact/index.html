<title>개념노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* Layout: collapsible sidebar (tablet) / tab bar (phone) + one working column; home → review → upload → collection → stats.
   Flat surfaces, hairline borders, small radii; colour only where it carries meaning (subject, rating, state). */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eaedf2;
  --border: #dce0e8;
  --text: #161a22;
  --text-2: #546072;
  --text-3: #8590a0;
  --accent: #2648c8;
  --accent-ink: #ffffff;
  --accent-soft: #e6ebfb;
  --danger: #c2362c;
  --danger-soft: #fbe9e7;
  --warn: #946200;
  --warn-soft: #f8efd7;
  --good: #17744f;
  --good-soft: #e1f3ea;
  --paper: #ffffff;
  --heat1: #d6defa;
  --heat2: #aebcf3;
  --heat3: #7a90e8;
  --heat4: #2648c8;
  --mark: #fde68a;
  --toast-bg: #161a22;
  --toast-fg: #f3f5f8;
  --overlay: rgba(8, 10, 14, .92);
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow-md: 0 8px 24px rgba(16, 24, 40, .08);
  --radius-lg: 14px;
  --radius: 10px;
  --radius-sm: 8px;
  --sidebar-w: 232px;
  --rail-w: 68px;
  --font-ui: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #171b22; --surface-2: #212631; --border: #2b3240;
    --text: #e7eaf0; --text-2: #a3acbc; --text-3: #7a8494;
    --accent: #8ba2ff; --accent-ink: #0f1217; --accent-soft: #1d2542;
    --danger: #ff8a7d; --danger-soft: #3a1f1d; --warn: #e5b04f; --warn-soft: #382d14;
    --good: #55c995; --good-soft: #173225;
    --heat1: #20294d; --heat2: #2f3d78; --heat3: #4a62c4; --heat4: #8ba2ff;
    --mark: #6b5a12; --toast-bg: #e7eaf0; --toast-fg: #0f1217;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #171b22; --surface-2: #212631; --border: #2b3240;
  --text: #e7eaf0; --text-2: #a3acbc; --text-3: #7a8494;
  --accent: #8ba2ff; --accent-ink: #0f1217; --accent-soft: #1d2542;
  --danger: #ff8a7d; --danger-soft: #3a1f1d; --warn: #e5b04f; --warn-soft: #382d14;
  --good: #55c995; --good-soft: #173225;
  --heat1: #20294d; --heat2: #2f3d78; --heat3: #4a62c4; --heat4: #8ba2ff;
  --mark: #6b5a12; --toast-bg: #e7eaf0; --toast-fg: #0f1217;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow-md: 0 8px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
button, select, input, textarea { font-family: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
img { max-width: 100%; }
svg { display: block; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

#app { display: flex; flex-direction: column; height: 100%; }
.main-area { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
.topbar {
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
}
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; flex-shrink: 0;
}
.topbar h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }

.content {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 20px 16px 28px;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}

/* phone: bottom tab bar */
.tabbar {
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1; border: none; background: none;
  padding: 10px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-3); font-size: 11px; font-weight: 600; cursor: pointer;
}
.tab-btn.active { color: var(--accent); }
.tab-btn .icn { width: 21px; height: 21px; flex-shrink: 0; }

/* tablet / desktop: sidebar that folds into an icon rail */
.sidebar { display: none; }
.nav-toggle {
  margin-left: auto; width: 32px; height: 32px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
}
.nav-toggle:hover { background: var(--surface-2); color: var(--text); }
.nav-toggle svg { width: 16px; height: 16px; transition: transform .2s; }

@media (min-width: 820px) {
  #app { flex-direction: row; }
  .topbar, .tabbar { display: none; }
  .sidebar {
    display: flex; flex-direction: column;
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    transition: width .2s ease;
    overflow: hidden;
  }
  .sidebar .brand-row { display: flex; align-items: center; gap: 10px; padding: 18px 14px 16px 18px; min-height: 68px; }
  .sidebar h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
  .sidebar nav { flex: 1; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar .tab-btn {
    flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 12px;
    padding: 11px 12px; border-radius: var(--radius-sm);
    font-size: 14px; white-space: nowrap;
  }
  .sidebar .tab-btn:hover { background: var(--surface-2); }
  .sidebar .tab-btn.active { background: var(--accent-soft); color: var(--accent); }
  .sidebar .tab-btn .icn { width: 20px; height: 20px; }
  #app.nav-collapsed .sidebar { width: var(--rail-w); }
  #app.nav-collapsed .sidebar .brand-row { flex-direction: column; padding: 14px 0; gap: 12px; }
  #app.nav-collapsed .sidebar h1, #app.nav-collapsed .sidebar .tab-label { display: none; }
  #app.nav-collapsed .sidebar .nav-toggle { margin-left: 0; }
  #app.nav-collapsed .sidebar .nav-toggle svg { transform: rotate(180deg); }
  #app.nav-collapsed .sidebar .tab-btn { justify-content: center; padding: 12px 0; }
  .content { max-width: 760px; padding: 28px 32px 40px; }
}
@media (min-width: 1180px) {
  .content { max-width: 960px; }
}

.empty-state { text-align: center; padding: 64px 16px; color: var(--text-3); }
.empty-state .e-icn { width: 36px; height: 36px; margin: 0 auto 12px; color: var(--text-3); }
.loading { text-align: center; padding: 48px 16px; color: var(--text-3); font-size: 13px; }
.done-banner { text-align: center; padding: 56px 16px; color: var(--text-2); }
.done-banner .e-icn { width: 40px; height: 40px; margin: 0 auto 12px; color: var(--good); }

/* ── review ── */
.progress-line { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.stat-pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-2); }
.stat-pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.stat-pill b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text); }
.dot-new { background: var(--accent); }
.dot-learning { background: var(--danger); }
.dot-review { background: var(--good); }

.review-split { display: flex; flex-direction: column; gap: 12px; }
.review-stage { position: relative; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: auto; display: flex; padding: 10px; -webkit-overflow-scrolling: touch; }
.review-stage img { display: block; margin: auto; max-width: 100%; max-height: max(300px, calc(100dvh - 330px)); width: auto; height: auto; object-fit: contain; background: var(--paper); border-radius: 4px; box-shadow: var(--shadow-sm); cursor: zoom-in; }
.review-stage.wide img { width: 100%; max-height: none; margin: 0 auto auto; cursor: zoom-out; }
.stage-empty { margin: auto; color: var(--text-3); font-size: 13px; }
.stage-tools { position: absolute; right: 12px; top: 12px; margin: 0; height: auto; width: auto; }
.stage-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-sm); }
.stage-btn:hover { color: var(--text); }
.review-side { display: flex; flex-direction: column; gap: 12px; }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.subj-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--text); }
.subj-tag i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
.leech-badge { padding: 2px 10px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); font-size: 11px; font-weight: 700; }
.card-meta { font-size: 11px; color: var(--text-3); font-family: var(--font-num); }
.review-caption { padding: 12px 14px; font-size: 15px; white-space: pre-wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
@media (min-width: 820px) {
  .content.review-mode { max-width: none; padding: 14px 16px; overflow: hidden; }
  .content.review-mode #reviewBody { height: 100%; }
  .content.review-mode .review-split { flex-direction: row; height: 100%; gap: 14px; }
  .content.review-mode .review-stage { flex: 1 1 0; min-width: 0; }
  .content.review-mode .review-stage img { max-height: 100%; }
  .content.review-mode .review-stage.wide img { max-height: none; }
  .content.review-mode .review-side { flex: 0 0 280px; overflow-y: auto; }
  .content.review-mode .progress-line { flex-direction: column; align-items: stretch; margin: 0; gap: 6px; justify-content: flex-start; }
  .content.review-mode .stat-pill b { margin-left: auto; }
  .content.review-mode .stat-pill { justify-content: flex-start; border-radius: var(--radius-sm); padding: 7px 12px; }
  .content.review-mode .rating-bar { margin-top: auto; position: static; background: none; padding: 0; }
  .content.review-mode .rating-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .content.review-mode .rate-btn { padding: 22px 4px 16px; font-size: 17px; }
}
@media (min-width: 1180px) { .content.review-mode .review-side { flex-basis: 320px; } }

.rating-bar { position: sticky; bottom: 0; padding: 4px 0 2px; background: var(--bg); }
.rating-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate-btn {
  position: relative; border: 1px solid transparent; border-radius: var(--radius);
  padding: 12px 4px 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.rate-btn:disabled { opacity: .5; cursor: default; }
.rate-btn:not(:disabled):active { transform: translateY(1px); }
.rate-again { background: var(--danger-soft); color: var(--danger); }
.rate-hard { background: var(--warn-soft); color: var(--warn); }
.rate-good { background: var(--good-soft); color: var(--good); }
.rate-easy { background: var(--accent-soft); color: var(--accent); }
.rate-preview { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 500; opacity: .85; }
.rate-key { position: absolute; top: 5px; right: 7px; font-family: var(--font-num); font-size: 10px; font-weight: 500; opacity: .5; }
@media (hover: none) { .rate-key { display: none; } }
.undo-btn { margin-top: 8px; }

/* ── upload ── */
.step-title { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-2); margin: 0 0 10px; }
.step-title small { font-size: 12px; font-weight: 500; color: var(--text-3); }
.field-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-2); margin: 0 0 10px; }
select, textarea, input[type=text] {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); font-size: 14px;
}
select:focus, textarea:focus, input:focus { border-color: var(--accent); }
.subject-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.subject-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: var(--radius-sm); padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
.subject-chip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.subject-chip:hover { background: var(--surface-2); }
.subject-chip.on { color: var(--text); border-color: var(--text); background: var(--surface); box-shadow: inset 0 0 0 1px var(--text); }
.dropzone-group { display: grid; gap: 10px; margin-top: 0; }
.dropzone-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .dropzone-row { grid-template-columns: 1fr; } }
.dropzone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px 16px; gap: 6px;
  border: 1.5px dashed var(--border); border-radius: var(--radius-lg);
  color: var(--text-2); font-size: 14px; font-weight: 600; cursor: pointer;
  background: var(--surface);
}
.dropzone:hover { border-color: var(--text-3); }
.dropzone .e-icn { width: 26px; height: 26px; color: var(--text-3); }
.dropzone input { display: none; }
.dropzone.ai-zone { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); padding: 34px 16px; }
.dropzone.ai-zone .e-icn { color: var(--accent); width: 30px; height: 30px; }
.ai-sub { font-size: 12px; font-weight: 500; color: var(--text-2); }
.section-label { font-size: 12px; font-weight: 700; color: var(--text-3); margin: 22px 0 10px; letter-spacing: .02em; }
.ai-progress { text-align: center; padding: 48px 16px 20px; color: var(--text-2); font-size: 14px; font-weight: 600; }
.ai-progress .sub { font-size: 12px; color: var(--text-3); font-weight: 500; margin-top: 6px; }
.ai-spinner { width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ai-spinner { animation-duration: 3s; } .sidebar, .nav-toggle svg { transition: none; } }
.ai-summary { font-size: 13px; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }

/* ── PDF manual crop ── */
.pdf-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.pdf-nav .page-count { font-size: 13px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
.pdf-nav button {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer;
}
.pdf-nav button:disabled { opacity: .4; cursor: default; }
.crop-stage { position: relative; width: 100%; touch-action: none; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.crop-stage img { width: 100%; display: block; user-select: none; }
.crop-box { position: absolute; border: 2px solid var(--accent); background: rgba(38, 72, 200, .14); cursor: move; }
.crop-handle {
  position: absolute; width: 24px; height: 24px;
  background: var(--accent); border: 2px solid var(--surface); border-radius: 50%;
  transform: translate(-50%, -50%); box-shadow: var(--shadow-sm);
}
.crop-handle[data-mode="nw"] { left: 0; top: 0; cursor: nwse-resize; }
.crop-handle[data-mode="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
.crop-handle[data-mode="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
.crop-handle[data-mode="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
.crop-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.crop-count { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 10px; }

.btn-primary {
  width: 100%; padding: 13px; background: var(--accent); color: var(--accent-ink);
  border: none; border-radius: var(--radius); font-weight: 700; font-size: 14px; cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .5; }
.btn-secondary {
  width: 100%; padding: 12px; background: var(--surface); color: var(--text-2);
  border: 1px solid var(--border); border-radius: var(--radius); font-weight: 700; font-size: 14px; cursor: pointer;
  text-align: center;
}
.btn-secondary:hover { background: var(--surface-2); }
.btn-icon {
  width: 30px; height: 30px; border-radius: var(--radius-sm); border: none; cursor: pointer;
  background: transparent; color: var(--text-3);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.btn-icon svg { width: 16px; height: 16px; }
.btn-icon:hover { background: var(--danger-soft); color: var(--danger); }

/* upload review: cropped problems to confirm */
.thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; margin: 14px 0; }
.thumb-card {
  border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border);
  overflow: hidden; display: flex; flex-direction: column;
}
.thumb-card .thumb-img { background: var(--surface-2); height: 260px; display: flex; align-items: center; justify-content: center; padding: 8px; }
.thumb-card img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; background: var(--paper); border-radius: 3px; cursor: zoom-in; display: block; }
.thumb-card .thumb-body { padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.thumb-card textarea { font-size: 13px; padding: 8px 10px; min-height: 52px; resize: vertical; line-height: 1.5; }
.thumb-card-foot { display: flex; align-items: center; justify-content: space-between; }
.thumb-card-foot label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); font-weight: 600; cursor: pointer; }
.save-bar { position: sticky; bottom: 0; padding: 10px 0 2px; background: var(--bg); }

/* ── collection (모아보기) ── */
.concept-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.toolbar-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1 1 200px; min-width: 0; width: auto; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 14px; }
.search-input:focus { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 2px; gap: 2px; }
.seg button { border: none; background: transparent; color: var(--text-2); padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--text); color: var(--bg); }
.chip-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip-scroll::-webkit-scrollbar { display: none; }
.filter-chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; cursor: pointer; }
.filter-chip i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
.filter-chip.on { color: var(--bg); background: var(--text); border-color: var(--text); }
.backlog-note { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); font-size: 12px; line-height: 1.5; }
.backlog-note b { font-size: 13px; }
.old-recall { display: flex; align-items: center; gap: 18px; }
.old-pct { font-family: var(--font-num); font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.old-pct small { font-size: 18px; color: var(--text-3); margin-left: 2px; }
.old-desc { font-size: 14px; }
.old-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* ───────────────── SRS: 안키 v2 스케줄러 (순수 함수) ───────────────── */

var SRS_CONFIG = {
  learningSteps: [1, 10],          // 분
  graduatingInterval: 1,           // 일
  easyInterval: 4,                 // 일
  relearningSteps: [10],           // 분
  lapseNewIntervalMultiplier: 0,
  minimumInterval: 1,              // 일
  startingEase: 2.5,
  minEase: 1.3,
  easyBonus: 1.3,
  hardMultiplier: 1.2,
  intervalModifier: 1.0,
  maxInterval: 180,                // 일
  newCardsPerDay: 20,
  reviewsPerDay: 200,
  backlogThreshold: 30,            // 기한이 하루 이상 지난 복습 카드가 이 개수 이상이면 '밀린 복습 정리' 모드
  backlogDailyReviews: 60,         // 정리 모드에서 하루에 내는 복습 카드 수 (새 카드는 멈춤)
  dayRolloverHour: 4,
  learnAheadMinutes: 20,
  leechThreshold: 8,
  reviewLogRetentionDays: 30,
  fuzzEnabled: true,
  examDay: null,                   // ankiDay number of the nearest upcoming exam, set at runtime
};

function localDayNumber(d) {
  return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
}

function ankiDay(date, cfg) {
  var shifted = new Date(date.getTime() - cfg.dayRolloverHour * 3600000);
  return localDayNumber(shifted);
}

function startOfAnkiDay(dayNumber, cfg) {
  var now = new Date();
  var offsetMs = now.getTimezoneOffset() * 60000;
  var d = new Date(dayNumber * 86400000 + offsetMs);
  d.setTime(d.getTime() + cfg.dayRolloverHour * 3600000);
  return d;
}

function ankiDayKey(date, cfg) {
  var d = startOfAnkiDay(ankiDay(date, cfg), cfg);
  var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}

// With an exam coming, never schedule a review past the exam day, and in the last
// 14 days keep every card within 4 days so nothing sits unseen right before it.
function examCapFor(left, cfg) {
  var cap = left <= 14 ? Math.min(4, left - 1) : left - 1;
  return Math.max(cfg.minimumInterval, Math.min(cfg.maxInterval, cap));
}
function examIntervalCap(cfg) {
  if (cfg.examDay == null) return cfg.maxInterval;
  var left = cfg.examDay - ankiDay(new Date(), cfg);
  return left <= 0 ? cfg.maxInterval : examCapFor(left, cfg);
}

function clampInterval(ivl, cfg) {
  return Math.min(Math.max(Math.round(ivl), cfg.minimumInterval), examIntervalCap(cfg));
}

function fuzzInterval(ivl, cfg, rand) {
  if (!cfg.fuzzEnabled) return ivl;
  rand = rand || Math.random;
  if (ivl < 2) return ivl;
  if (ivl === 2) return 2 + Math.floor(rand() * 2);
  var r = ivl < 7 ? 0.25 : ivl < 30 ? 0.15 : 0.05;
  var fuzz = Math.max(1, Math.round(ivl * r));
  var min = ivl - fuzz, max = ivl + fuzz;
  return min + Math.floor(rand() * (max - min + 1));
}

function computeReviewIntervals(ivl, ease, delay, cfg) {
  var hardRaw = (ivl + Math.floor(delay / 4)) * cfg.hardMultiplier;
  var hard = Math.max(Math.round(hardRaw * cfg.intervalModifier), ivl + 1);
  var goodRaw = (ivl + Math.floor(delay / 2)) * ease;
  var good = Math.max(Math.round(goodRaw * cfg.intervalModifier), hard + 1);
  var easyRaw = (ivl + delay) * ease * cfg.easyBonus;
  var easy = Math.max(Math.round(easyRaw * cfg.intervalModifier), good + 1);
  return { hard: hard, good: good, easy: easy };
}

function graduateCard(ivl, now, cfg) {
  ivl = Math.max(cfg.minimumInterval, Math.min(ivl, examIntervalCap(cfg)));
  return {
    state: 'review', step: 0, intervalDays: ivl,
    nextReviewDate: startOfAnkiDay(ankiDay(now, cfg) + ivl, cfg).toISOString(),
  };
}

function scheduleLearning(card, rating, now, cfg, steps, stateName, normalGraduateIvl, easyGraduateIvl) {
  var step = card.step || 0;
  if (rating === 'again') {
    return { state: stateName, step: 0, nextReviewDate: new Date(now.getTime() + steps[0] * 60000).toISOString() };
  }
  if (rating === 'hard') {
    var minutes;
    if (step === 0) {
      minutes = steps.length >= 2 ? Math.round((steps[0] + steps[1]) / 2) : Math.min(steps[0] * 1.5, steps[0] + 1440);
    } else {
      minutes = steps[step];
    }
    return { state: stateName, step: step, nextReviewDate: new Date(now.getTime() + minutes * 60000).toISOString() };
  }
  if (rating === 'easy') {
    return graduateCard(easyGraduateIvl, now, cfg);
  }
  var nextStep = step + 1;
  if (nextStep < steps.length) {
    return { state: stateName, step: nextStep, nextReviewDate: new Date(now.getTime() + steps[nextStep] * 60000).toISOString() };
  }
  return graduateCard(normalGraduateIvl, now, cfg);
}

function scheduleReview(card, rating, now, cfg, rand) {
  var ivl = card.intervalDays;
  var ease = card.easeFactor;
  var delay = Math.max(0, ankiDay(now, cfg) - ankiDay(new Date(card.nextReviewDate), cfg));

  if (rating === 'again') {
    var newLapses = (card.lapses || 0) + 1;
    var newEase = Math.max(cfg.minEase, ease - 0.20);
    var lapseIvl = Math.max(cfg.minimumInterval, Math.round(ivl * cfg.lapseNewIntervalMultiplier));
    return {
      state: 'relearning', step: 0,
      easeFactor: newEase,
      lapseInterval: lapseIvl,
      lapses: newLapses,
      leech: newLapses >= cfg.leechThreshold,
      nextReviewDate: new Date(now.getTime() + cfg.relearningSteps[0] * 60000).toISOString(),
    };
  }

  var computed = computeReviewIntervals(ivl, ease, delay, cfg);
  var chosenIvl, newEase2;
  if (rating === 'hard') { chosenIvl = computed.hard; newEase2 = Math.max(cfg.minEase, ease - 0.15); }
  else if (rating === 'good') { chosenIvl = computed.good; newEase2 = ease; }
  else { chosenIvl = computed.easy; newEase2 = ease + 0.15; }

  var finalIvl = clampInterval(fuzzInterval(chosenIvl, cfg, rand), cfg);

  return {
    state: 'review', step: 0,
    easeFactor: newEase2,
    intervalDays: finalIvl,
    nextReviewDate: startOfAnkiDay(ankiDay(now, cfg) + finalIvl, cfg).toISOString(),
  };
}

function schedule(card, rating, now, cfg, rand) {
  var state = card.state;
  var result;
  if (state === 'new' || state === 'learning') {
    result = scheduleLearning(card, rating, now, cfg, cfg.learningSteps, 'learning', cfg.graduatingInterval, cfg.easyInterval);
  } else if (state === 'relearning') {
    var lapseIvl = card.lapseInterval || cfg.minimumInterval;
    result = scheduleLearning(card, rating, now, cfg, cfg.relearningSteps, 'relearning', lapseIvl, lapseIvl + 1);
  } else {
    result = scheduleReview(card, rating, now, cfg, rand);
  }
  result.reps = (card.reps || 0) + 1;
  result.lastReviewedAt = now.toISOString();
  // running totals of 다시 / 어려움 presses, used by the 모아보기 "자주 어려워하는 순" sort
  result.againCount = (card.againCount !== undefined ? card.againCount : (card.lapses || 0)) + (rating === 'again' ? 1 : 0);
  result.hardCount = (card.hardCount || 0) + (rating === 'hard' ? 1 : 0);
  if (result.lapses === undefined) result.lapses = card.lapses || 0;
  if (result.leech === undefined) result.leech = card.leech || false;
  if (result.easeFactor === undefined) result.easeFactor = card.easeFactor;
  if (result.lapseInterval === undefined) result.lapseInterval = card.lapseInterval || cfg.minimumInterval;
  if (result.intervalDays === undefined) result.intervalDays = card.intervalDays;
  return result;
}

function formatMinutes(mins) {
  if (mins < 60) return Math.round(mins) + '분';
  var hours = mins / 60;
  if (hours < 24) return (Math.round(hours * 10) / 10) + '시간';
  return formatDays(Math.round(hours / 24));
}
function formatDays(days) {
  if (days < 30) return days + '일';
  if (days < 365) return (Math.round(days / 30 * 10) / 10) + '개월';
  return (Math.round(days / 365 * 10) / 10) + '년';
}

function previewIntervals(card, now, cfg) {
  var state = card.state;
  if (state === 'new' || state === 'learning') {
    var steps = cfg.learningSteps;
    var step = card.step || 0;
    var hardMin = step === 0
      ? (steps.length >= 2 ? (steps[0] + steps[1]) / 2 : Math.min(steps[0] * 1.5, steps[0] + 1440))
      : steps[step];
    var nextStep = step + 1;
    var goodLabel = nextStep < steps.length ? formatMinutes(steps[nextStep]) : formatDays(cfg.graduatingInterval);
    return { again: formatMinutes(steps[0]), hard: formatMinutes(hardMin), good: goodLabel, easy: formatDays(cfg.easyInterval) };
  }
  if (state === 'relearning') {
    var rsteps = cfg.relearningSteps;
    var rstep = card.step || 0;
    var lapseIvl = card.lapseInterval || cfg.minimumInterval;
    var rHard = rstep === 0
      ? (rsteps.length >= 2 ? (rsteps[0] + rsteps[1]) / 2 : Math.min(rsteps[0] * 1.5, rsteps[0] + 1440))
      : rsteps[rstep];
    var rNextStep = rstep + 1;
    var rGood = rNextStep < rsteps.length ? formatMinutes(rsteps[rNextStep]) : formatDays(lapseIvl);
    return { again: formatMinutes(rsteps[0]), hard: formatMinutes(rHard), good: rGood, easy: formatDays(lapseIvl + 1) };
  }
  var ivl = card.intervalDays, ease = card.easeFactor;
  var delay = Math.max(0, ankiDay(now, cfg) - ankiDay(new Date(card.nextReviewDate), cfg));
  var c = computeReviewIntervals(ivl, ease, delay, cfg);
  return {
    again: formatMinutes(cfg.relearningSteps[0]),
    hard: formatDays(clampInterval(c.hard, cfg)),
    good: formatDays(clampInterval(c.good, cfg)),
    easy: formatDays(clampInterval(c.easy, cfg)),
  };
}

function normalizeCard(doc, cfg) {
  var c = Object.assign({}, doc);
  if (c.state === undefined) {
    if (!c.lastReviewedAt) {
      c.state = 'new'; c.step = 0; c.easeFactor = cfg.startingEase; c.reps = 0; c.lapses = 0;
      c.intervalDays = c.intervalDays || cfg.minimumInterval;
    } else {
      c.state = 'review';
      c.easeFactor = c.easeFactor || cfg.startingEase;
      c.intervalDays = c.intervalDays || cfg.minimumInterval;
      if (c.nextReviewDate) {
        var day = ankiDay(new Date(c.nextReviewDate), cfg);
        c.nextReviewDate = startOfAnkiDay(day, cfg).toISOString();
      }
      c.reps = c.reps === undefined ? 1 : c.reps;
      c.lapses = c.lapses || 0;
      c.step = 0;
    }
  }
  if (c.step === undefined) c.step = 0;
  if (c.lapses === undefined) c.lapses = 0;
  if (c.leech === undefined) c.leech = false;
  if (c.reps === undefined) c.reps = 0;
  if (c.easeFactor === undefined) c.easeFactor = cfg.startingEase;
  if (c.intervalDays === undefined) c.intervalDays = cfg.minimumInterval;
  if (c.lapseInterval === undefined) c.lapseInterval = cfg.minimumInterval;
  if (c.againCount === undefined) c.againCount = c.lapses || 0; // older cards only counted lapses
  if (c.hardCount === undefined) c.hardCount = 0;
  return c;
}

/* ── reviewLog 정리: 30일 넘은 로그는 세션 시작 시 조용히 지운다.
   undo는 메모리 스택으로만 동작하므로 DB의 reviewLog는 undo에 필요하지 않고,
   dailyStats가 이미 날짜별 집계를 영구 보존하므로 원본 로그를 오래 쌓아둘 이유가 없다. ── */
async function pruneOldReviewLogs() {
  try {
    var cutoffDay = ankiDay(new Date(), SRS_CONFIG) - SRS_CONFIG.reviewLogRetentionDays;
    var snap = await db.collection('reviewLog').where('ankiDay', '<', cutoffDay).limit(200).get();
    for (var i = 0; i < snap.docs.length; i++) {
      try { await db.doc('reviewLog/' + snap.docs[i].id).delete(); } catch (e) {}
    }
  } catch (e) {}
}

async function loadDailyStats(key) {
  try {
    var snap = await db.doc('dailyStats/' + key).get();
    if (snap && snap.exists) {
      var data = snap.data();
      return { newIntroduced: data.newIntroduced || 0, reviewsDone: data.reviewsDone || 0, studyMs: data.studyMs || 0, answered: data.answered || 0 };
    }
  } catch (e) {}
  return { newIntroduced: 0, reviewsDone: 0, studyMs: 0, answered: 0 };
}

async function bumpDailyStats(field, delta, extra) {
  if (field) dailyStatsToday[field] = Math.max(0, (dailyStatsToday[field] || 0) + delta);
  if (extra) {
    dailyStatsToday.studyMs = (dailyStatsToday.studyMs || 0) + extra.studyMs;
    dailyStatsToday.answered = (dailyStatsToday.answered || 0) + extra.answered;
  }
  await db.doc('dailyStats/' + dailyStatsKey).set({
    newIntroduced: dailyStatsToday.newIntroduced,
    reviewsDone: dailyStatsToday.reviewsDone,
    studyMs: dailyStatsToday.studyMs || 0,
    answered: dailyStatsToday.answered || 0,
  });
}

document.addEventListener('keydown', function (e) {
  if (currentTab !== 'review' || !reviewQueue || reviewQueue.length === 0 || reviewBusy) return;
  var tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  }
});

function examDayNumber(dateStr) {
  var p = String(dateStr).split('-');
  return localDayNumber(new Date(+p[0], +p[1] - 1, +p[2], 12));
}

function nearestExam() {
  var today = ankiDay(new Date(), SRS_CONFIG);
  var upcoming = examList
    .filter(function (x) { return x.date && !isNaN(examDayNumber(x.date)) && examDayNumber(x.date) >= today; })
    .map(function (x) { return { exam: x, day: examDayNumber(x.date), left: examDayNumber(x.date) - today }; })
    .sort(function (a, b) { return a.day - b.day; });
  return upcoming;
}

function syncExamConfig() {
  var up = nearestExam();
  SRS_CONFIG.examDay = up.length ? up[0].day : null;
}

async function loadExams() {
  try {
    var snap = await db.doc('settings/exams').get();
    if (snap && snap.exists) examList = (snap.data().list || []).filter(function (x) { return x && x.date; });
  } catch (e) {}
  syncExamConfig();
}

async function saveExams() {

}

function fmtExamDate(dateStr) {

async function loadReviewQueue() {
  var now = new Date();
  var tomorrowBound = startOfAnkiDay(ankiDay(now, SRS_CONFIG) + 1, SRS_CONFIG).toISOString();
  var snap = await db.collection('concepts')
    .where('nextReviewDate', '<=', tomorrowBound)
    .orderBy('nextReviewDate', 'asc')
    .limit(1000)
    .get();
  var cards = snap.docs.map(function (d) { return normalizeCard(Object.assign({ id: d.id }, d.data()), SRS_CONFIG); });

  dailyStatsKey = ankiDayKey(now, SRS_CONFIG);
  dailyStatsToday = await loadDailyStats(dailyStatsKey);
  var newLeft = Math.max(0, SRS_CONFIG.newCardsPerDay - dailyStatsToday.newIntroduced);
  var reviewLeft = Math.max(0, SRS_CONFIG.reviewsPerDay - dailyStatsToday.reviewsDone);

  var learningDueNow = [], learningAhead = [], reviewCards = [], newCards = [];
  var learnAheadBound = now.getTime() + SRS_CONFIG.learnAheadMinutes * 60000;
  var today = ankiDay(now, SRS_CONFIG);

  cards.forEach(function (c) {
    if (c.state === 'learning' || c.state === 'relearning') {
      var due = new Date(c.nextReviewDate).getTime();
      if (due <= now.getTime()) learningDueNow.push(c);
      else if (due <= learnAheadBound) learningAhead.push({ card: c, dueAt: due });
    } else if (c.state === 'review') {
      if (ankiDay(new Date(c.nextReviewDate), SRS_CONFIG) <= today) reviewCards.push(c);
    } else if (c.state === 'new') {
      newCards.push(c);
    }
  });

  reviewCards.sort(function (a, b) { return a.nextReviewDate.localeCompare(b.nextReviewDate); });
  newCards.sort(function (a, b) { return (a.createdAt || '').localeCompare(b.createdAt || ''); });

  // 밀린 복습 정리: 기한이 지난 복습 카드가 많이 쌓이면 새 카드를 멈추고, 가장 오래 밀린 것(같으면 간격이 짧은 것)부터 하루 분량만 낸다
  var overdue = reviewCards.filter(function (c) { return ankiDay(new Date(c.nextReviewDate), SRS_CONFIG) < today; });
  backlogInfo = null;
  if (overdue.length >= SRS_CONFIG.backlogThreshold) {
    reviewCards.sort(function (a, b) {
      return (a.nextReviewDate.slice(0, 10) !== b.nextReviewDate.slice(0, 10) ? a.nextReviewDate.localeCompare(b.nextReviewDate) : 0) ||
        (a.intervalDays - b.intervalDays) || (a.easeFactor - b.easeFactor);
    });
    reviewLeft = Math.max(0, Math.min(reviewLeft, SRS_CONFIG.backlogDailyReviews - dailyStatsToday.reviewsDone));
    newLeft = 0;
    backlogInfo = { overdue: overdue.length, shown: Math.min(reviewLeft, reviewCards.length), held: Math.max(0, reviewCards.length - reviewLeft), newHeld: newCards.length };
  }

  reviewQueue = learningDueNow.concat(reviewCards.slice(0, reviewLeft), newCards.slice(0, newLeft));
  waitingQueue = learningAhead;
}

function tryPromoteFromWaiting() {
  if (!reviewQueue || reviewQueue.length > 0 || waitingQueue.length === 0) return;
  var now = Date.now();
  var idx = -1;
  for (var i = 0; i < waitingQueue.length; i++) {
    if (waitingQueue[i].dueAt <= now) { idx = i; break; }
  }
  if (idx === -1) {
    // 보여줄 카드가 없고 학습 카드만 남아 있으면 learnAhead 범위까지 당겨 보여준다
    var aheadBound = now + SRS_CONFIG.learnAheadMinutes * 60000;
    var soonest = null;
    for (var j = 0; j < waitingQueue.length; j++) {
      if (waitingQueue[j].dueAt <= aheadBound && (!soonest || waitingQueue[j].dueAt < soonest.dueAt)) {
        soonest = waitingQueue[j]; idx = j;
      }
    }
  }
  if (idx !== -1) {
    var entry = waitingQueue.splice(idx, 1)[0];
    reviewQueue.push(entry.card);
  }
}

function queueCounts() {
  var all = reviewQueue.concat(waitingQueue.map(function (w) { return w.card; }));
  var counts = { newCount: 0, learningCount: 0, reviewCount: 0 };
  all.forEach(function (c) {
    if (c.state === 'new') counts.newCount++;
    else if (c.state === 'learning' || c.state === 'relearning') counts.learningCount++;
    else counts.reviewCount++;
  });
  return counts;
}

function backlogBanner() {
  if (!backlogInfo) return '';
  var b = backlogInfo;
  return '<div class="backlog-note"><b>밀린 복습 정리 중</b>' +
    '<span>기한이 지난 복습 ' + b.overdue + '개 · 오래 밀린 것부터 오늘 ' + SRS_CONFIG.backlogDailyReviews + '개까지만 보여요.' +
    (b.newHeld ? ' 새 카드 ' + b.newHeld + '개는 정리가 끝나면 나와요.' : '') + '</span></div>';
}

function renderWaitingScreen(el) {
  var nextDue = Math.min.apply(null, waitingQueue.map(function (w) { return w.dueAt; }));
  var mins = Math.max(1, Math.ceil((nextDue - Date.now()) / 60000));
  el.innerHTML = '<div class="empty-state">' + ICONS.moon + '<p>' + mins + '분 후에 다시 나와요.</p></div>' +
    (undoStack.length > 0 ? '<button class="btn-secondary undo-btn" onclick="undoLast()">되돌리기</button>' : '');
}

async function renderReviewTab() {
  if (currentTab !== 'review') return;
  var content = document.getElementById('content');
  if (!document.getElementById('reviewBody')) {
    content.innerHTML = '<div id="reviewBody"></div>';
  }
  var el = document.getElementById('reviewBody');
  if (!db) {
    el.innerHTML = '<div class="empty-state">' + ICONS.moon + '<p>데이터 저장 기능을 사용할 수 없어요.</p></div>';
    return;
  }
  if (reviewQueue === null) {
    el.innerHTML = skelReview();
    try { await loadReviewQueue(); }
    catch (e) { if (currentTab === 'review') el.innerHTML = errorBox('복습할 개념을 불러오지 못했어요', 'renderReviewTab()'); return; }
    if (currentTab !== 'review') return;
  }
  clearInterval(reviewWaitTimer);
  tryPromoteFromWaiting();

  if (reviewQueue.length === 0) {
    if (waitingQueue.length > 0) {
      renderWaitingScreen(el);
      reviewWaitTimer = setInterval(function () {
        if (currentTab !== 'review') { clearInterval(reviewWaitTimer); return; }
        tryPromoteFromWaiting();
        if (reviewQueue.length > 0) renderReviewTab();
        else renderWaitingScreen(el);
      }, 5000);
      return;
    }
    var undoBtn = undoStack.length > 0 ? '<button class="btn-secondary undo-btn" style="max-width:240px;margin:12px auto 0" onclick="undoLast()">되돌리기</button>' : '';
    if (reviewHasCompletedAny) {
      el.innerHTML = backlogBanner() + '<div class="done-banner"><div class="home-done-icn">' + ICONS.done + '</div><h2 class="state-title">오늘 복습 끝!</h2><p>' +
        (sessionAnswered ? sessionAnswered + '번 답했어요. ' : '') + (backlogInfo && backlogInfo.held ? '밀린 ' + backlogInfo.held + '개는 내일 이어서 나와요.' : '내일 또 만나요.') + '</p>' +
        '<div class="state-actions"><button class="btn-primary" onclick="switchTab(\'home\')">홈으로</button><button class="btn-secondary" onclick="switchTab(\'upload\')">문제 올리기</button></div>' + undoBtn + '</div>';
    } else {
      el.innerHTML = backlogBanner() + emptyBox(ICONS.moon, '오늘 복습할 개념이 없어요', '새 문제를 올리면 오늘 밤 복습에 나타나요.',
        '<button class="btn-primary" onclick="switchTab(\'upload\')">문제 올리기</button>');
    }
    return;
  }

  var item = reviewQueue[0];
  var isNewCard = lastPaintedId !== item.id;
  lastPaintedId = item.id;
  if (cardShownId !== item.id) { cardShownId = item.id; cardShownAt = Date.now(); }
  var counts = queueCounts();
  var preview = previewIntervals(item, new Date(), SRS_CONFIG);
  var imgUrl = item.imageId ? ('/_blob/' + item.imageId) : '';
  var subj = SUBJECTS.find(function (x) { return x.id === item.subjectId; });
  var dis = reviewBusy ? ' disabled' : '';
  var remaining = reviewQueue.length + waitingQueue.length;
  var pct = Math.round(sessionAnswered / Math.max(1, sessionAnswered + remaining) * 100);
  function rateBtn(key, cls, label, rating) {
    return '<button class="rate-btn ' + cls + '" data-rating="' + rating + '" onclick="rateCurrent(\'' + rating + '\')"' + dis + '><span class="rate-key">' + key + '</span>' + label +
      '<span class="rate-preview">' + preview[rating] + '</span></button>';
  }
  var pills =
    '<span class="stat-pill"><i class="dot-new"></i>새 카드 <b>' + counts.newCount + '</b></span>' +
    '<span class="stat-pill"><i class="dot-learning"></i>학습 중 <b>' + counts.learningCount + '</b></span>' +
    '<span class="stat-pill"><i class="dot-review"></i>복습 <b>' + counts.reviewCount + '</b></span>';
  el.innerHTML =
    '<div class="review-split' + (isNewCard ? ' card-in' : '') + '">' +
      '<div class="review-stage' + (reviewZoom === 'wide' ? ' wide' : '') + '" id="reviewStage">' +
        (imgUrl ? '<img src="' + imgUrl + '" alt="개념" onclick="toggleReviewZoom()">' +
          '<div class="stage-tools">' +
            '<button class="stage-btn" id="zoomBtn" onclick="toggleReviewZoom()">' + (reviewZoom === 'wide' ? '전체 보기' : '가로 채우기') + '</button>' +
            '<button class="stage-btn" onclick="openLightbox(\'' + imgUrl + '\')">확대</button>' +
          '</div>' : '<div class="stage-empty">이미지 없음</div>') +
      '</div>' +
      '<aside class="review-side">' +
        '<div class="rv-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
        '<div class="side-top">' +
          '<span class="subj-tag"><i style="background:' + (subj ? subj.c1 : 'var(--text-3)') + '"></i>' + (subj ? subj.name : '과목 없음') + '</span>' +
          (item.leech ? '<span class="leech-badge">자주 틀림</span>' : (item.reps ? '<span class="card-meta">복습 ' + item.reps + '회</span>' : '<span class="card-meta">새 카드</span>')) +
        '</div>' +
        backlogBanner() +
        '<div class="progress-line">' + pills + '</div>' +
        (item.text ? '<div class="review-caption">' + escapeHtml(item.text) + '</div>' : '') +
        '<div class="rating-bar"><div class="rating-grid">' +
          rateBtn('1', 'rate-again', '다시', 'again') + rateBtn('2', 'rate-hard', '어려움', 'hard') +
          rateBtn('3', 'rate-good', '좋음', 'good') + rateBtn('4', 'rate-easy', '쉬움', 'easy') +
        '</div>' + (undoStack.length > 0 ? '<button class="btn-secondary undo-btn" onclick="undoLast()">되돌리기</button>' : '') + '</div>' +
      '</aside>' +
    '</div>';
  var nx = reviewQueue[1];                       // warm the next card so it appears instantly
  if (nx && nx.imageId) { var pre = new Image(); pre.src = '/_blob/' + nx.imageId; }
}

function setRatingBusy(rating) {
  document.querySelectorAll('.rate-btn').forEach(function (b) {
    b.disabled = true;
    if (b.dataset.rating === rating) b.classList.add('picked');
  });
}

var reviewZoom = 'fit';
function toggleReviewZoom() {
  reviewZoom = reviewZoom === 'fit' ? 'wide' : 'fit';
  var st = document.getElementById('reviewStage');
  if (!st) return;
  st.classList.toggle('wide', reviewZoom === 'wide');
  st.scrollTop = 0;
  var b = document.getElementById('zoomBtn');
  if (b) b.textContent = reviewZoom === 'wide' ? '전체 보기' : '가로 채우기';
}

async function rateCurrent(rating) {
  if (reviewBusy || !reviewQueue || reviewQueue.length === 0) return;
  var before = reviewQueue[0];
  reviewBusy = true;
  setRatingBusy(rating);     // mark the pressed button in place; no re-render, so the image doesn't flash

  var now = new Date();
  var after = schedule(before, rating, now, SRS_CONFIG);
  var updated = Object.assign({}, before, after);
  delete updated.id;

  var logId = 'revlog-' + now.getTime() + '-' + Math.random().toString(36).slice(2, 8);
  var logEntry = {
    conceptId: before.id, rating: rating,
    stateBefore: before.state, intervalBefore: before.intervalDays, easeBefore: before.easeFactor,
    stateAfter: after.state, intervalAfter: after.intervalDays, easeAfter: after.easeFactor,
    dueBefore: before.nextReviewDate, dueAfter: after.nextReviewDate,
    reviewedAt: now.toISOString(), ankiDay: ankiDay(now, SRS_CONFIG),
  };
  var statsField = before.state === 'new' ? 'newIntroduced' : (before.state === 'review' ? 'reviewsDone' : null);
  // time on this card, capped so a card left open doesn't inflate the total
  var spentMs = cardShownAt ? Math.min(Date.now() - cardShownAt, 120000) : 0;

  try {
    await db.doc('concepts/' + before.id).update(updated);
    await db.doc('reviewLog/' + logId).set(logEntry);
    await bumpDailyStats(statsField, statsField ? 1 : 0, { studyMs: spentMs, answered: 1 });
  } catch (e) {
    reviewBusy = false;
    showToast('저장 실패, 다시 눌러주세요');
    renderReviewTab();
    return;
  }

  reviewHasCompletedAny = true;
  allConcepts = null;   // 모아보기 정렬(어려움 횟수)이 방금 한 복습을 반영하도록 다시 불러오게 함
  cardShownId = null;
  lastPaintedId = null;
  sessionAnswered++;
  reviewQueue.shift();
  undoStack.push({ conceptId: before.id, beforeCard: before, logId: logId, statsField: statsField });
  if (undoStack.length > 30) undoStack.shift();

  if (after.state === 'learning' || after.state === 'relearning') {
    waitingQueue.push({ card: Object.assign({}, updated, { id: before.id }), dueAt: new Date(after.nextReviewDate).getTime() });
  }

  reviewBusy = false;
  renderReviewTab();
}

async function undoLast() {
  if (undoStack.length === 0) return;
  var entry = undoStack.pop();
  try {
    await db.doc('concepts/' + entry.conceptId).update(entry.beforeCard);
    await db.doc('reviewLog/' + entry.logId).delete();
    if (entry.statsField) await bumpDailyStats(entry.statsField, -1);
  } catch (e) {
    undoStack.push(entry);
    showToast('되돌리기 실패, 다시 눌러주세요');
    return;
  }
  allConcepts = null;
  sessionAnswered = Math.max(0, sessionAnswered - 1);
  lastPaintedId = null;
  waitingQueue = waitingQueue.filter(function (w) { return w.card.id !== entry.conceptId; });
  reviewQueue = reviewQueue.filter(function (c) { return c.id !== entry.conceptId; });
  reviewQueue.unshift(entry.beforeCard);
  renderReviewTab();
}

    el.innerHTML =
      '<h2 class="page-h">문제 올리기</h2>' +

      : emptyBox(ICONS.done, savedCount + '개 개념이 저장됐어요', '오늘 밤 복습 카드로 나타나요.',
          '<button class="btn-primary" onclick="resetUploadFlow()">새로 올리기</button><button class="btn-secondary" onclick="switchTab(\'home\')">홈으로</button>');

        (aiGateSkipped ? '빨강·파랑 메모가 없는 ' + aiGateSkipped + '페이지는 건너뛰었어요' + (aiScanSkipped ? '(스캔 쪽 ' + aiScanSkipped + '쪽은 필기 그림층이 없어서 제외)' : '') + '. ' : '') +

function renderSubjectPicker() {

  }).join('') + '</div>';
}

function pickUploadSubject(id) {
  uploadSubject = id;
  try { localStorage.setItem('uploadSubject', id); } catch (e) {}
  renderUploadTab();
}

function renderThumbCard(item) {
  return '<div class="thumb-card">' +
    '<div class="thumb-img"><img src="' + item.url + '" onclick="openLightbox(\'' + item.url + '\')" alt="개념"></div>' +
    '<div class="thumb-body">' +
    '<textarea placeholder="메모 (선택)" oninput="onCaptionInput(\'' + item.localId + '\', this.value)">' + escapeHtml(item.caption) + '</textarea>' +
    '<div class="thumb-card-foot">' +
      '<label><input type="checkbox" ' + (item.included ? 'checked' : '') + ' onchange="onIncludedChange(\'' + item.localId + '\', this.checked)"> 저장에 포함</label>' +
      '<button class="btn-icon" aria-label="삭제" onclick="removePendingUpload(\'' + item.localId + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg></button>' +
    '</div></div>' +
  '</div>';
}

function findPending(localId) { return pendingUploads.find(function (i) { return i.localId === localId; }); }

function onCaptionInput(localId, value) {
  var item = findPending(localId);
  if (item) item.caption = value;
}
function onIncludedChange(localId, checked) {
  var item = findPending(localId);
  if (item) item.included = checked;
  renderUploadTab();
}
function removePendingUpload(localId) {
  pendingUploads = pendingUploads.filter(function (i) { return i.localId !== localId; });
  renderUploadTab();
}

function onImagesPicked(fileList) {
  var files = Array.prototype.slice.call(fileList || []);
  if (files.length === 0) return;
  pendingUploads = pendingUploads.concat(files.map(function (file) {
    return {
      localId: 'p' + (uploadSeq++),
      file: file,
      url: URL.createObjectURL(file),
      caption: '',
      included: true,
    };
  }));
  uploadStage = 'review';
  renderUploadTab();
}

/* ───────────────── PDF manual crop ───────────────── */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function onPdfFilePicked(file) {
  if (!file) return;
  try {
    var buf = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
  } catch (e) {
    showToast('PDF를 여는 중 문제가 생겼어요');
    return;
  }
  pdfCurrentPage = 1;
  cropBounds = { x: 0.08, y: 0.08, width: 0.84, height: 0.3 };
  uploadStage = 'pdf-crop';
  await loadPdfPage();
  renderUploadTab();
}

function loadPdfPage() {
  return pdfDoc.getPage(pdfCurrentPage).then(function (page) {
    var viewport = page.getViewport({ scale: 1.6 });
    var canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    var ctx = canvas.getContext('2d');
    return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
      pdfPageImage = {
        dataUrl: canvas.toDataURL('image/jpeg', 0.9),
        width: canvas.width,
        height: canvas.height,
      };
    });
  });
}

function renderPdfCropStage(el) {
  if (!pdfPageImage) {
    el.innerHTML = '<div class="ai-progress"><div class="ai-spinner"></div>페이지를 불러오는 중</div>';
    return;
  }
  el.innerHTML =
    '<div class="pdf-nav">' +
      '<button onclick="pdfGoPage(-1)"' + (pdfCurrentPage <= 1 ? ' disabled' : '') + '>← 이전</button>' +
      '<span class="page-count">' + pdfCurrentPage + ' / ' + pdfDoc.numPages + '페이지</span>' +
      '<button onclick="pdfGoPage(1)"' + (pdfCurrentPage >= pdfDoc.numPages ? ' disabled' : '') + '>다음 →</button>' +
    '</div>' +
    '<div class="crop-stage" id="cropStage">' +
      '<img id="cropStageImg" src="' + pdfPageImage.dataUrl + '" alt="페이지" draggable="false">' +
      '<div class="crop-box" id="cropBox">' +
        '<div class="crop-handle" data-mode="nw"></div>' +
        '<div class="crop-handle" data-mode="ne"></div>' +
        '<div class="crop-handle" data-mode="sw"></div>' +
        '<div class="crop-handle" data-mode="se"></div>' +
      '</div>' +
    '</div>' +
    '<div class="crop-actions">' +
      '<button class="btn-primary" onclick="addCropRegion()">이 영역을 개념으로 담기</button>' +
      '<button class="btn-secondary" onclick="finishPdfCrop()">완료 — 검토 화면으로</button>' +
    '</div>' +
    '<p class="crop-count">지금까지 ' + pendingUploads.length + '개 담김</p>';
  updateCropBoxUI();
  wireCropBoxDrag();
}

function pdfGoPage(delta) {
  var next = pdfCurrentPage + delta;
  if (next < 1 || next > pdfDoc.numPages) return;
  pdfCurrentPage = next;
  cropBounds = { x: 0.08, y: 0.08, width: 0.84, height: 0.3 };
  pdfPageImage = null;
  renderUploadTab();
  loadPdfPage().then(renderUploadTab);
}

async function addCropRegion() {
  var blob = await cropToBlob(pdfPageImage, cropBounds);
  pendingUploads.push({
    localId: 'p' + (uploadSeq++),
    file: blob,
    url: URL.createObjectURL(blob),
    caption: '',
    included: true,
  });
  showToast('담았어요 (' + pendingUploads.length + '개)');
  // shift the box down as a starting guess for the next region on this page
  var nextY = Math.min(0.95 - cropBounds.height, cropBounds.y + cropBounds.height + 0.03);
  cropBounds = Object.assign({}, cropBounds, { y: Math.max(0, nextY) });
  updateCropBoxUI();
  document.querySelector('.crop-count').textContent = '지금까지 ' + pendingUploads.length + '개 담김';
}

function finishPdfCrop() {
  pdfDoc = null;
  pdfPageImage = null;
  uploadStage = pendingUploads.length > 0 ? 'review' : 'idle';
  renderUploadTab();
}

function cropToBlob(page, bounds) {
  return new Promise(function (resolve) {
    var img = new Image();
    img.onload = function () {
      var px = {
        x: Math.round(bounds.x * page.width),
        y: Math.round(bounds.y * page.height),
        w: Math.max(1, Math.round(bounds.width * page.width)),
        h: Math.max(1, Math.round(bounds.height * page.height)),
      };
      var canvas = document.createElement('canvas');
      canvas.width = px.w;
      canvas.height = px.h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, px.x, px.y, px.w, px.h, 0, 0, px.w, px.h);
      canvas.toBlob(function (blob) { resolve(blob); }, 'image/jpeg', 0.92);
    };
    img.src = page.dataUrl;
  });
}

function updateCropBoxUI() {
  var box = document.getElementById('cropBox');
  if (!box) return;
  box.style.left = (cropBounds.x * 100) + '%';
  box.style.top = (cropBounds.y * 100) + '%';
  box.style.width = (cropBounds.width * 100) + '%';
  box.style.height = (cropBounds.height * 100) + '%';
}

function wireCropBoxDrag() {
  var box = document.getElementById('cropBox');
  if (!box) return;

  function beginDrag(mode) {
    return function (e) {
      e.preventDefault();
      e.stopPropagation();
      cropDragMode = mode;
      cropDragStartX = e.clientX;
      cropDragStartY = e.clientY;
      cropDragStartBounds = Object.assign({}, cropBounds);
      window.addEventListener('pointermove', onCropDragMove);
      window.addEventListener('pointerup', onCropDragUp);
    };
  }

  box.onpointerdown = beginDrag('move');
  box.querySelectorAll('.crop-handle').forEach(function (h) {
    h.onpointerdown = beginDrag(h.dataset.mode);
  });
}

function onCropDragMove(e) {
  if (!cropDragMode) return;
  var stage = document.getElementById('cropStage');
  if (!stage) return;
  var rect = stage.getBoundingClientRect();
  var dx = (e.clientX - cropDragStartX) / rect.width;
  var dy = (e.clientY - cropDragStartY) / rect.height;
  var b = cropDragStartBounds;
  var clamp01 = function (n) { return Math.min(1, Math.max(0, n)); };
  var next = Object.assign({}, b);

  if (cropDragMode === 'move') {
    next.x = clamp01(b.x + dx);
    next.y = clamp01(b.y + dy);
  } else if (cropDragMode === 'se') {
    next.width = clamp01(b.x + b.width + dx) - b.x;
    next.height = clamp01(b.y + b.height + dy) - b.y;
  } else if (cropDragMode === 'nw') {
    var nx = clamp01(b.x + dx), ny = clamp01(b.y + dy);
    next.width = b.x + b.width - nx;
    next.height = b.y + b.height - ny;
    next.x = nx; next.y = ny;
  } else if (cropDragMode === 'ne') {
    var ny2 = clamp01(b.y + dy);
    next.width = clamp01(b.x + b.width + dx) - b.x;
    next.height = b.y + b.height - ny2;
    next.y = ny2;
  } else if (cropDragMode === 'sw') {
    var nx2 = clamp01(b.x + dx);
    next.width = b.x + b.width - nx2;
    next.height = clamp01(b.y + b.height + dy) - b.y;
    next.x = nx2;
  }

  next.width = Math.max(0.03, Math.min(next.width, 1 - next.x));

async function saveAllUploads() {
  if (!assets || !db) { showToast('저장 기능을 사용할 수 없어요'); return; }
  uploadStage = 'saving';
  var toSave = pendingUploads.filter(function (i) { return i.included; });
  var count = savedCount, failed = [];
  saveProgress = { i: 0, n: toSave.length };
  renderUploadTab();
  for (var i = 0; i < toSave.length; i++) {

    renderUploadTab();

      var up = await assets.upload(item.file);
      await db.collection('concepts').add({
        text: item.caption || '',
        subjectId: uploadSubject,
        imageId: up.id,
        state: 'new',
        step: 0,
        easeFactor: SRS_CONFIG.startingEase,
        intervalDays: SRS_CONFIG.minimumInterval,
        lapseInterval: SRS_CONFIG.minimumInterval,

// Local colour gate. Counts red/blue pen pixels (HSV) on a half-size copy of the page, after removing printed colour:
//  - connected pieces that sit (≥85%) inside text-layer boxes are printed text (e.g. blue problem numbers),
//  - solid blocks, hollow frames and thin straight rules are printed shapes (tabs, boxes, bullets).
// Pages with almost no pen ink left are skipped without any AI call (recall first: the threshold is low).
var GATE_MIN_PX = 40;

function penInk(canvas, textBoxes, layers) {
  var w = Math.max(1, Math.round(canvas.width / 2)), h = Math.max(1, Math.round(canvas.height / 2));
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var ctx = c.getContext('2d', { willReadFrequently: true });

  var d = ctx.getImageData(0, 0, w, h).data;

      for (var zi = 0; zi < zones.length; zi++) { var zz = zones[zi]; if (zx >= zz[0] && zx <= zz[2] && zy >= zz[1] && zy <= zz[3]) { inZone = true; break; } }
      if (!inZone) continue;

    if (isPenPx(d, i * 4)) { mask[i] = 1; list.push(i); }
  }
  if (layers && !layers.length) return { w: w, h: h, xs: [], ys: [], n: 0 }; // bare scan: printed colour lives in the image, no overlay = no handwriting
  var boxes = (textBoxes || []).map(function (b) { return [b[0] * w, b[1] * h, b[2] * w, b[3] * h]; });
  var inText = function (x, y) {
    for (var k = 0; k < boxes.length; k++) { var b = boxes[k]; if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3]) return true; }
    return false;
  };
  var xs = [], ys = [];
  for (var li = 0; li < list.length; li++) {
    var start = list[li];
    if (mask[start] !== 1) continue;
    var stack = [start], comp = [];
    mask[start] = 2;
    while (stack.length) {
      var cur = stack.pop(); comp.push(cur);
      var cx = cur % w, cy = (cur / w) | 0;
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
        var nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        var ni = ny * w + nx;
        if (mask[ni] === 1) { mask[ni] = 2; stack.push(ni); }
      }
    }
    var x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, ins = 0, j;
    for (j = 0; j < comp.length; j++) {
      var px = comp[j] % w, py = (comp[j] / w) | 0;
      if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
      if (boxes.length && inText(px, py)) ins++;

    var bw = x1 - x0 + 1, bh = y1 - y0 + 1, n = comp.length;
    var printed = false;
    if (n >= 6) {
      if (ins / n >= 0.85) printed = true;                                            // printed coloured text
      else if (Math.min(bw, bh) >= 6 && n / (bw * bh) >= 0.6) printed = true;         // solid block
      else if (Math.min(bw, bh) <= 4 && Math.max(bw, bh) / Math.min(bw, bh) >= 12) printed = true; // straight rule
      else if (bw >= 20 && bh >= 20) {                                                 // hollow frame

        for (j = 0; j < comp.length; j++) {

    for (j = 0; j < comp.length; j++) { xs.push(comp[j] % w); ys.push((comp[j] / w) | 0); }

// Overlay images on the page (not the page-sized background), as page fractions. Tablet note apps
// export handwriting as one image laid over the page (digital or scanned); null = no usable overlay info.
async function pdfOverlayImages(page) {
  var vp = page.getViewport({ scale: 1 });
  var ol = await page.getOperatorList(), O = pdfjsLib.OPS, U = pdfjsLib.Util;
  var ctm = vp.transform.slice(), stack = [], boxes = [];
  var imgOps = [O.paintImageXObject, O.paintInlineImageXObject, O.paintImageMaskXObject, O.paintSolidColorImageMask, O.paintJpegXObject];
  for (var i = 0; i < ol.fnArray.length; i++) {
    var fn = ol.fnArray[i];
    if (fn === O.save) stack.push(ctm.slice());
    else if (fn === O.restore) { if (stack.length) ctm = stack.pop(); }
    else if (fn === O.transform) ctm = U.transform(ctm, ol.argsArray[i]);
    else if (imgOps.indexOf(fn) >= 0) {
      var pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(function (pt) { return U.applyTransform(pt, ctm); });
      var xs = pts.map(function (q) { return q[0]; }), ys = pts.map(function (q) { return q[1]; });
      boxes.push([Math.max(0, Math.min.apply(null, xs) / vp.width), Math.max(0, Math.min.apply(null, ys) / vp.height),

}

function pageHasColoredInk(ink) { return ink.n >= GATE_MIN_PX; }

// Text-layer boxes as page fractions, used to recognise printed text.
async function pdfTextBoxes(page) {
  var vp = page.getViewport({ scale: 1 });
  var content = await page.getTextContent();
  var out = [];
  content.items.forEach(function (it) {
    if (!it.str || !it.str.trim()) return;
    var tr = pdfjsLib.Util.transform(vp.transform, it.transform);
    var fs = Math.hypot(tr[2], tr[3]) || 10;
    out.push([(tr[4] - 1) / vp.width, (tr[5] - fs - 1) / vp.height, (tr[4] + (it.width || 0) + 1) / vp.width, (tr[5] + fs * 0.25 + 1) / vp.height]);
  });
  return out;
}

// ── Phase 2: split a digital PDF page into problems from its text layer (no AI call) ──
function isPenPx(d, i) {
  var r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
  var mx = Math.max(r, g, b), df = mx - Math.min(r, g, b);

  var hue;
  if (mx === r) hue = ((g - b) / df + 6) % 6; else if (mx === g) hue = (b - r) / df + 2; else hue = (r - g) / df + 4;
  hue *= 60;

}

// Fade everything that is not red/blue pen (black solving ink, printed text) so the AI only sees the memo.
// Uses a looser saturation than the gate so anti-aliased pen edges survive.
function inkFocus(canvas) {
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
  for (var i = 0; i < d.length; i += 4) {
    var r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
    var mx = Math.max(r, g, b), df = mx - Math.min(r, g, b), keep = false;
    if (mx >= 0.25 && df / mx >= 0.15 && df > 0.05) {
      var hue;
      if (mx === r) hue = ((g - b) / df + 6) % 6; else if (mx === g) hue = (b - r) / df + 2; else hue = (r - g) / df + 4;
      hue *= 60;
      keep = hue < 25 || hue > 330 || (hue > 185 && hue < 265);
    }
    if (!keep) { d[i] = 255 - (255 - d[i]) * 0.2; d[i + 1] = 255 - (255 - d[i + 1]) * 0.2; d[i + 2] = 255 - (255 - d[i + 2]) * 0.2; }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

// Memo regions as page fractions {x0,y0,x1,y1}: pen pixels → 6px cells → merge nearby cells.
function memoRegions(ink) {
  var CELL = 6, GROW = 2;
  var w = ink.w, h = ink.h;
  var cw = Math.ceil(w / CELL), ch = Math.ceil(h / CELL), cnt = new Uint16Array(cw * ch);
  for (var pi = 0; pi < ink.n; pi++) cnt[((ink.ys[pi] / CELL) | 0) * cw + ((ink.xs[pi] / CELL) | 0)]++;
  var on = new Uint8Array(cw * ch), dil = new Uint8Array(cw * ch), i, cx, cy;
  for (i = 0; i < on.length; i++) on[i] = cnt[i] >= 2 ? 1 : 0;
  for (cy = 0; cy < ch; cy++) for (cx = 0; cx < cw; cx++) {
    if (!on[cy * cw + cx]) continue;
    for (var dy = -GROW; dy <= GROW; dy++) for (var dx = -GROW; dx <= GROW; dx++) {
      var ny = cy + dy, nx = cx + dx;

    }
  }
  var lab = new Int32Array(cw * ch), regions = [], k = 0;
  for (i = 0; i < dil.length; i++) {
    if (!dil[i] || lab[i]) continue;
    k++;
    var stack = [i], box = { x0: 1e9, y0: 1e9, x1: -1, y1: -1, mass: 0 };
    lab[i] = k;
    while (stack.length) {
      var cur = stack.pop(), qx = cur % cw, qy = (cur / cw) | 0;

      for (var ddy = -1; ddy <= 1; ddy++) for (var ddx = -1; ddx <= 1; ddx++) {

// Problem ranges per column from the PDF text layer. Returns null when the page has no usable text layer.
async function pdfProblemRanges(page) {
  var vp = page.getViewport({ scale: 1 }), W = vp.width, H = vp.height;
  var content = await page.getTextContent();
  var items = [];
  content.items.forEach(function (it) {
    if (!it.str || !it.str.trim()) return;
    var tr = pdfjsLib.Util.transform(vp.transform, it.transform);
    var fs = Math.hypot(tr[2], tr[3]) || 10;
    items.push({ s: it.str.trim(), x0: tr[4], x1: tr[4] + (it.width || 0), top: tr[5] - fs, bot: tr[5] + fs * 0.25, fs: fs });
  });

  var BINS = 100, cover = new Array(BINS).fill(0);

    for (var b = Math.max(0, Math.floor(it.x0 / W * BINS)); b <= Math.min(BINS - 1, Math.floor(it.x1 / W * BINS)); b++) cover[b]++;
  });

  for (var b = 30; b <= 70; b++) {
    if (cover[b] <= limit) { if (runStart < 0) runStart = b; var len = b - runStart + 1; if (len > bestLen) { bestLen = len; bestMid = (runStart + b + 1) / 2; } }
    else runStart = -1;

  cols.forEach(function (cr, ci) {
    var ci_items = items.filter(function (it) { var m = (it.x0 + it.x1) / 2; return m >= cr[0] && m < cr[1]; });
    if (!ci_items.length) return;
    var left = Math.min.apply(null, ci_items.filter(function (it) { return it.s.length >= 3; }).map(function (it) { return it.x0; }).concat([1e9]));
    var colX0 = Math.min.apply(null, ci_items.map(function (it) { return it.x0; })), colX1 = Math.max.apply(null, ci_items.map(function (it) { return it.x1; }));

        textBottom: inRange.length ? Math.max.apply(null, inRange.filter(function (it) { return it.top < H * 0.92; }).map(function (it) { return it.bot; }).concat([y0])) / H : y0 / H
      });
    });
  });
  return out.some(function (r) { return r.problem; }) ? out : null;
}

function cropCanvas(src, box) {
  var clamp = function (v) { return Math.min(1000, Math.max(0, v)); };
  var x0 = clamp(Math.min(box[0], box[2]) - AI_BOX_PAD), y0 = clamp(Math.min(box[1], box[3]) - AI_BOX_PAD);
  var x1 = clamp(Math.max(box[0], box[2]) + AI_BOX_PAD), y1 = clamp(Math.max(box[1], box[3]) + AI_BOX_PAD);
  var px = Math.round(x0 / 1000 * src.width), py = Math.round(y0 / 1000 * src.height);
  var pw = Math.max(1, Math.round((x1 - x0) / 1000 * src.width)), ph = Math.max(1, Math.round((y1 - y0) / 1000 * src.height));
  var c = document.createElement('canvas');
  c.width = pw; c.height = ph;
  c.getContext('2d').drawImage(src, px, py, pw, ph, 0, 0, pw, ph);
  return c;

function pushPending(blob, caption, included) {

// Red/blue pen pixels from the gate that fall inside a 0-1000 box.
function inkInBox(ink, box) {

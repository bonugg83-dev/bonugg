<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>개념노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-2: #edeef3;
  --border: #e2e3ea;
  --text: #1c1c1e;
  --text-2: #6e6e73;
  --text-3: #8e8e93;
  --accent: #6366f1;
  --accent-2: #a855f7;
  --accent-soft: #eeeafd;
  --danger: #d9463f;
  --danger-soft: #fbeae9;
  --warn: #b3790f;
  --warn-soft: #faf1dc;
  --good: #1f8a5f;
  --good-soft: #e4f4ec;
  --radius-lg: 20px;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow-sm: 0 1px 2px rgba(20,22,30,.05);
  --shadow-md: 0 10px 26px rgba(20,22,30,.08);
  --sidebar-w: 232px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans KR', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.65;
  -webkit-tap-highlight-color: transparent;
}
button, select, input, textarea { font-family: inherit; }
img { max-width: 100%; }
svg { display: block; }

#app { display: flex; flex-direction: column; height: 100%; }
.topbar {
  padding: 16px 20px 14px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar .brand-mark {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; flex-shrink: 0;
}
.topbar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 22px 18px 28px;
  max-width: 640px;
  width: 100%;
  margin: 0 auto;
}

/* phone bottom tab bar */
.tabbar {
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1; border: none; background: none;
  padding: 11px 4px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--text-3); font-size: 11px; font-weight: 600; cursor: pointer;
}
.tab-btn.active { color: var(--accent); }
.tab-btn .icn { width: 21px; height: 21px; }

/* ── tablet layout: sidebar instead of bottom bar ── */
.sidebar { display: none; }

@media (min-width: 820px) {
  #app { flex-direction: row; }
  .topbar { display: none; }
  .tabbar { display: none; }
  .sidebar {
    display: flex;
    flex-direction: column;
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .sidebar .brand-row { display: flex; align-items: center; gap: 10px; padding: 22px 20px 20px; }
  .sidebar .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0; }
  .sidebar h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .sidebar nav { flex: 1; padding: 4px 12px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar .tab-btn {
    flex-direction: row; justify-content: flex-start; gap: 12px;
    padding: 12px 14px; border-radius: var(--radius-sm);
    font-size: 14px;
  }
  .sidebar .tab-btn.active { background: var(--accent-soft); color: var(--accent); }
  .sidebar .tab-btn .icn { width: 20px; height: 20px; flex-shrink: 0; }
  .content { max-width: 760px; padding: 32px 40px 40px; }
  .thumb-grid, .gallery-grid { grid-template-columns: repeat(3, 1fr) !important; }
}
@media (min-width: 1180px) {
  .content { max-width: 920px; }
  .thumb-grid, .gallery-grid { grid-template-columns: repeat(4, 1fr) !important; }
}

.empty-state { text-align: center; padding: 64px 16px; color: var(--text-3); }
.empty-state .e-icn { width: 40px; height: 40px; margin: 0 auto 14px; color: var(--text-3); }
.loading { text-align: center; padding: 48px 16px; color: var(--text-3); font-size: 13px; }
.done-banner { text-align: center; padding: 56px 16px; color: var(--text-2); }
.done-banner .e-icn { width: 44px; height: 44px; margin: 0 auto 14px; color: var(--good); }

/* ── review ── */
.progress-line { text-align: center; margin-bottom: 14px; }
.progress-line .count { font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.review-card {
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  margin-bottom: 18px;
}
.accent-stripe { height: 4px; width: 100%; }
.review-card img { width: 100%; display: block; max-height: 56vh; object-fit: contain; background: var(--surface-2); cursor: zoom-in; }
.review-caption { padding: 16px 18px; font-size: 15px; white-space: pre-wrap; border-top: 1px solid var(--border); }
.rating-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate-btn { border: none; border-radius: var(--radius-sm); padding: 14px 4px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-sm); }
.rate-btn:disabled { opacity: .5; }
.rate-again { background: var(--danger-soft); color: var(--danger); }
.rate-hard { background: var(--warn-soft); color: var(--warn); }
.rate-good { background: var(--good-soft); color: var(--good); }
.rate-easy { background: var(--accent-soft); color: var(--accent); }

/* ── upload ── */
.field-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 7px; text-transform: uppercase; letter-spacing: .04em; }
select, textarea, input[type=text] {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text); font-size: 14px;
}
select:focus, textarea:focus, input:focus { outline: none; border-color: var(--accent); }
.dropzone-group { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.dropzone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 32px 16px; gap: 10px;
  border: 1.5px dashed var(--border); border-radius: var(--radius-lg);
  color: var(--text-2); font-size: 14px; font-weight: 600; cursor: pointer;
  background: var(--surface);
}
.dropzone .e-icn { width: 30px; height: 30px; color: var(--accent); }
.dropzone input { display: none; }

/* ── PDF manual crop ── */
.pdf-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.pdf-nav .page-count { font-size: 13px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
.pdf-nav button {
  border: none; background: var(--surface-2); color: var(--text);
  padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer;
}
.pdf-nav button:disabled { opacity: .4; cursor: default; }
.crop-stage { position: relative; width: 100%; touch-action: none; border-radius: var(--radius); overflow: hidden; }
.crop-stage img { width: 100%; display: block; user-select: none; }
.crop-box { position: absolute; border: 2px solid var(--accent); background: rgba(99,102,241,.14); cursor: move; }
.crop-handle {
  position: absolute; width: 24px; height: 24px;
  background: var(--accent); border: 2px solid #fff; border-radius: 50%;
  transform: translate(-50%, -50%); box-shadow: var(--shadow-sm);
}
.crop-handle[data-mode="nw"] { left: 0; top: 0; cursor: nwse-resize; }
.crop-handle[data-mode="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
.crop-handle[data-mode="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
.crop-handle[data-mode="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
.crop-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.crop-count { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 10px; }

.btn-primary {
  width: 100%; padding: 14px; background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff;
  border: none; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; cursor: pointer;
  box-shadow: 0 8px 20px rgba(139,140,246,.35);
}
.btn-primary:disabled { opacity: .5; }
.btn-secondary {
  width: 100%; padding: 13px; background: var(--surface-2); color: var(--text-2);
  border: none; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; cursor: pointer;
  text-align: center;
}
.btn-icon {
  width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--surface-2); color: var(--text-2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.btn-icon svg { width: 15px; height: 15px; }
.btn-icon:hover { background: var(--danger-soft); color: var(--danger); }

.thumb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.thumb-card {
  border-radius: var(--radius); padding: 10px; background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.thumb-card img { width: 100%; border-radius: var(--radius-sm); cursor: pointer; display: block; margin-bottom: 8px; aspect-ratio: 4/3; object-fit: cover; background: var(--surface-2); }
.thumb-card input[type=text] { font-size: 12px; padding: 7px 10px; margin-bottom: 8px; }
.thumb-card-foot { display: flex; align-items: center; justify-content: space-between; }
.thumb-card-foot label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); font-weight: 600; }
.save-bar { position: sticky; bottom: 0; padding-top: 6px; }

/* ── concepts grid (모아보기) ── */
.subject-filter { margin-bottom: 16px; max-width: 220px; }
.gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gallery-item {
  border-radius: var(--radius); overflow: hidden; background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.gallery-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; cursor: pointer; background: var(--surface-2); }
.gallery-item .g-body { padding: 10px 12px 12px; }
.gallery-item .g-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
/* the color dot sits over the select via a positioned wrapper, so the select itself stays plain text */
.subj-select-wrap { position: relative; display: inline-flex; align-items: center; }
.subj-select-wrap select {
  font: inherit; font-weight: 700; color: #fff;
  border: none; cursor: pointer;
  padding: 3px 10px 3px 22px; border-radius: 999px; appearance: none; -webkit-appearance: none;
}
/* the dropdown's own option list is native UI (white popup), so give options
   their own dark-on-light colors instead of inheriting the select's white text */
.subj-select-wrap select option { color: var(--text); background: var(--surface); font-weight: 500; }
.subj-select-wrap .dot {
  position: absolute; left: 3px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; border-radius: 50%; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800;
  pointer-events: none;
}
.gallery-item .g-caption { font-size: 12px; color: var(--text-2); white-space: pre-wrap; word-break: break-word; cursor: pointer; }
.gallery-item .g-caption-edit {
  width: 100%; font-size: 12px; color: var(--text); line-height: 1.5;
  border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 8px;
  min-height: 44px; resize: vertical; background: var(--surface);
}

.lightbox-overlay {
  position: fixed; inset: 0; z-index: 220;
  background: rgba(8,9,13,.85);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; cursor: zoom-out;
}
.lightbox-overlay img { max-height: 100%; border-radius: 10px; }

.toast {
  position: fixed;
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--text); color: var(--bg);
  padding: 11px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 300; max-width: 86vw; text-align: center; box-shadow: var(--shadow-md);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 820px) { .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }
</style>

  <!-- tablet sidebar -->

  <div class="main-area" style="display:flex;flex-direction:column;flex:1;min-width:0;">

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="review" onclick="switchTab('review')">
        <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>

      </button>
      <button class="tab-btn" data-tab="upload" onclick="switchTab('upload')">
        <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.6"/></svg>

        모아보기
      </button>

  </div>
</div>

<script>
var ICONS = {
  empty: '<svg class="e-icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h8l6 6v9.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 4v5a1 1 0 0 0 1 1h5"/></svg>',
  done: '<svg class="e-icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  moon: '<svg class="e-icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>',
  photos: '<svg class="e-icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 15.5l4.5-4.5a1.5 1.5 0 0 1 2.1 0l3.4 3.4"/><path d="M13.5 12.5l1.4-1.4a1.5 1.5 0 0 1 2.1 0l3 3"/><circle cx="8" cy="9" r="1.4"/></svg>',
  pdf: '<svg class="e-icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-17a1 1 0 0 1 1-1z"/><path d="M14 2.5v4a1 1 0 0 0 1 1h4"/><path d="M8.5 13.5h7M8.5 17h4.5"/></svg>',
};

var SUBJECTS = [
  { id: 'intermediate', name: '중급회계', mono: '중', c1: '#6366f1', c2: '#a855f7' },
  { id: 'advanced', name: '고급회계', mono: '고', c1: '#2563eb', c2: '#06b6d4' },
  { id: 'tax', name: '세무회계', mono: '세', c1: '#f59e0b', c2: '#f97316' },
  { id: 'finance', name: '재무관리', mono: '재', c1: '#10b981', c2: '#14b8a6' },
  { id: 'economics', name: '경제학', mono: '경', c1: '#f43f5e', c2: '#ec4899' },
  { id: 'cost', name: '원가관리회계', mono: '원', c1: '#a855f7', c2: '#d946ef' },
];

function subjectGradient(subjectId) {
  var subj = SUBJECTS.find(function (s) { return s.id === subjectId; });
  return subj ? ('linear-gradient(120deg, ' + subj.c1 + ', ' + subj.c2 + ')') : 'var(--surface-2)';
}

var DEFAULT_EASE = 2.5;
var MAX_INTERVAL_DAYS = 180;
var DAILY_REVIEW_CAP = 50;
var MIN_EASE = 1.3;

var db = null, assets = null;
var currentTab = 'review';

// review tab state
var reviewQueue = null;
var reviewIndex = 0;

// upload tab state
var uploadStage = 'idle'; // idle | pdf-crop | review | saving | done
var uploadSubject = SUBJECTS[0].id;
var pendingUploads = []; // { localId, file, url, caption, included }
var uploadSeq = 0;
var savedCount = 0;

// pdf manual-crop state
var pdfDoc = null;
var pdfCurrentPage = 1;
var pdfPageImage = null; // { dataUrl, width, height }
var cropBounds = { x: 0.08, y: 0.08, width: 0.84, height: 0.3 };
var cropDragMode = null;
var cropDragStartX = 0, cropDragStartY = 0, cropDragStartBounds = null;

// concepts tab state
var allConcepts = null;
var conceptsSubjectFilter = '';
var editingConceptId = null;

async function initCapabilities() {
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  try { assets = await window.claude.use('assets'); } catch (e) { assets = null; }
  renderCurrentTab();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderCurrentTab();
}

function renderCurrentTab() {
  if (currentTab === 'review') renderReviewTab();
  else if (currentTab === 'upload') renderUploadTab();
  else if (currentTab === 'concepts') renderConceptsTab();
}

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function subjectEditor(conceptId, subjectId) {
  var subj = SUBJECTS.find(function (s) { return s.id === subjectId; });
  var mono = subj ? subj.mono : '?';
  return '<span class="subj-select-wrap">' +
    '<span class="dot" style="background:' + (subj ? subj.c1 : '#8e8e93') + '">' + mono + '</span>' +
    '<select style="background:' + subjectGradient(subjectId) + '" onclick="event.stopPropagation()" onchange="onSubjectChange(\'' + conceptId + '\', this.value)">' +
    SUBJECTS.map(function (s) {
      return '<option value="' + s.id + '"' + (s.id === subjectId ? ' selected' : '') + '>' + s.name + '</option>';
    }).join('') +
    '</select></span>';
}

async function onSubjectChange(conceptId, newSubjectId) {
  try {
    await db.doc('concepts/' + conceptId).update({ subjectId: newSubjectId });
  } catch (e) {
    showToast('과목 변경 실패');
    return;
  }
  var concept = allConcepts.find(function (c) { return c.id === conceptId; });
  if (concept) concept.subjectId = newSubjectId;
  renderGalleryResults();
}

function startEditCaption(conceptId) {
  editingConceptId = conceptId;
  renderGalleryResults();
  var el = document.querySelector('.g-caption-edit');
  if (el) {
    el.focus();
    el.selectionStart = el.selectionEnd = el.value.length;
  }
}

async function saveEditCaption(conceptId, newText) {
  editingConceptId = null;
  try {
    await db.doc('concepts/' + conceptId).update({ text: newText });
  } catch (e) {
    showToast('저장 실패');
    renderGalleryResults();
    return;
  }
  var concept = allConcepts.find(function (c) { return c.id === conceptId; });
  if (concept) concept.text = newText;
  renderGalleryResults();
}

function openLightbox(url) {
  var overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = '<img src="' + url + '" alt="원본">';
  overlay.addEventListener('click', function () { overlay.remove(); });
  document.body.appendChild(overlay);
}

/* ───────────────── SRS ───────────────── */

function applySrs(state, rating) {
  var base = Math.max(state.intervalDays, 1);
  var ease = state.easeFactor;
  var interval;
  if (rating === 'again') {
    ease = Math.max(MIN_EASE, ease - 0.2);
    interval = 1;
  } else if (rating === 'hard') {
    ease = Math.max(MIN_EASE, ease - 0.15);
    interval = Math.round(base * 1.2);
  } else if (rating === 'good') {
    interval = Math.round(base * ease);
  } else { // easy
    ease = ease + 0.15;
    interval = Math.round(base * ease * 1.3);
  }
  interval = Math.min(Math.max(interval, 1), MAX_INTERVAL_DAYS);
  return { easeFactor: ease, intervalDays: interval };
}

function addDaysIso(days) {
  var d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString();
}

/* ───────────────── review tab ───────────────── */

async function renderReviewTab() {
  var el = document.getElementById('content');
  if (currentTab !== 'review') return;
  if (!db) {
    el.innerHTML = '<div class="empty-state">' + ICONS.moon + '<p>데이터 저장 기능을 사용할 수 없어요.</p></div>';
    return;
  }
  if (reviewQueue === null) {
    el.innerHTML = '<div class="loading">불러오는 중...</div>';
    try {
      var nowIso = new Date().toISOString();
      var snap = await db.collection('concepts')
        .where('nextReviewDate', '<=', nowIso)
        .orderBy('nextReviewDate', 'asc')
        .limit(DAILY_REVIEW_CAP)
        .get();
      reviewQueue = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    } catch (e) {
      reviewQueue = [];
    }
    reviewIndex = 0;
  }
  if (currentTab !== 'review') return;

  if (reviewQueue.length === 0) {
    el.innerHTML = '<div class="empty-state">' + ICONS.done + '<p>오늘 밤 복습할 개념이 없어요.</p></div>';
    return;
  }
  if (reviewIndex >= reviewQueue.length) {
    el.innerHTML = '<div class="done-banner">' + ICONS.done + '<p>오늘 밤 복습을 다 마쳤어요.</p></div>';
    return;
  }

  var item = reviewQueue[reviewIndex];
  var imgUrl = item.imageId ? ('/_blob/' + item.imageId) : '';
  el.innerHTML =
    '<div class="progress-line"><span class="count">' + (reviewIndex + 1) + ' / ' + reviewQueue.length + '</span></div>' +
    '<div class="review-card">' +
      '<div class="accent-stripe" style="background:' + subjectGradient(item.subjectId) + '"></div>' +
      (imgUrl ? '<img src="' + imgUrl + '" alt="개념" onclick="openLightbox(\'' + imgUrl + '\')">' : '') +
      (item.text ? '<div class="review-caption">' + escapeHtml(item.text) + '</div>' : '') +
    '</div>' +
    '<div class="rating-grid">' +
      '<button class="rate-btn rate-again" onclick="rateCurrent(\'again\')">다시</button>' +
      '<button class="rate-btn rate-hard" onclick="rateCurrent(\'hard\')">어려움</button>' +
      '<button class="rate-btn rate-good" onclick="rateCurrent(\'good\')">좋음</button>' +
      '<button class="rate-btn rate-easy" onclick="rateCurrent(\'easy\')">쉬움</button>' +
    '</div>';
}

async function rateCurrent(rating) {
  var item = reviewQueue[reviewIndex];
  if (!item) return;
  document.querySelectorAll('.rate-btn').forEach(function (b) { b.disabled = true; });
  var next = applySrs({ easeFactor: item.easeFactor || DEFAULT_EASE, intervalDays: item.intervalDays || 1 }, rating);
  var nextReviewDate = addDaysIso(next.intervalDays);
  try {
    await db.doc('concepts/' + item.id).update({
      easeFactor: next.easeFactor,
      intervalDays: next.intervalDays,
      nextReviewDate: nextReviewDate,
      lastReviewedAt: new Date().toISOString(),
    });
  } catch (e) {}
  reviewIndex++;
  renderReviewTab();
}

/* ───────────────── upload tab ───────────────── */

function renderUploadTab() {
  if (currentTab !== 'upload') return;
  var el = document.getElementById('content');

  if (uploadStage === 'idle') {
    el.innerHTML =
      '<label class="field-label">과목</label>' +
      '<select id="subjectSelect" onchange="uploadSubject=this.value">' +
        SUBJECTS.map(function (s) {
          return '<option value="' + s.id + '"' + (s.id === uploadSubject ? ' selected' : '') + '>' + s.name + '</option>';
        }).join('') +
      '</select>' +
      '<div class="dropzone-group">' +
        '<label class="dropzone">' +
          ICONS.pdf +
          'PDF 업로드 (직접 영역을 잘라서 추가)' +
          '<input type="file" accept="application/pdf" onchange="onPdfFilePicked(this.files[0])">' +
        '</label>' +
        '<label class="dropzone">' +
          ICONS.photos +
          '이미 잘라낸 사진/스크린샷 업로드' +
          '<input type="file" accept="image/*" multiple onchange="onImagesPicked(this.files)">' +
        '</label>' +
      '</div>';
    return;
  }

  if (uploadStage === 'pdf-crop') {
    renderPdfCropStage(el);
    return;
  }

  if (uploadStage === 'saving') {
    el.innerHTML = '<div class="loading">저장하는 중...</div>';
    return;
  }

  if (uploadStage === 'done') {
    el.innerHTML =
      '<div class="empty-state">' + ICONS.done + '<p>' + savedCount + '개 개념이 저장됐어요.<br>오늘 밤 복습 큐에 나타나요.</p></div>' +
      '<button class="btn-primary" onclick="resetUploadFlow()">새로 업로드</button>';
    return;
  }

  // review stage — plain confirm-before-save, no AI involved
  var html = '<div class="thumb-grid">' + pendingUploads.map(renderThumbCard).join('') + '</div>' +
    '<div class="save-bar"><button class="btn-primary" onclick="saveAllUploads()">전체 저장 (' +
    pendingUploads.filter(function (i) { return i.included; }).length + '개)</button></div>';
  el.innerHTML = html;
}

function renderThumbCard(item) {
  return '<div class="thumb-card">' +
    '<img src="' + item.url + '" onclick="openLightbox(\'' + item.url + '\')" alt="개념">' +
    '<input type="text" placeholder="메모 (선택)" value="' + escapeHtml(item.caption) + '" oninput="onCaptionInput(\'' + item.localId + '\', this.value)">' +
    '<div class="thumb-card-foot">' +
      '<label><input type="checkbox" ' + (item.included ? 'checked' : '') + ' onchange="onIncludedChange(\'' + item.localId + '\', this.checked)"> 포함</label>' +
      '<button class="btn-icon" onclick="removePendingUpload(\'' + item.localId + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg></button>' +
    '</div>' +
  '</div>';
}

function findPending(localId) { return pendingUploads.find(function (i) { return i.localId === localId; }); }

function onCaptionInput(localId, value) {
  var item = findPending(localId);
  if (item) item.caption = value;
}
function onIncludedChange(localId, checked) {
  var item = findPending(localId);
  if (item) item.included = checked;
  renderUploadTab();
}
function removePendingUpload(localId) {
  pendingUploads = pendingUploads.filter(function (i) { return i.localId !== localId; });
  renderUploadTab();
}

function onImagesPicked(fileList) {
  var files = Array.prototype.slice.call(fileList || []);
  if (files.length === 0) return;
  pendingUploads = pendingUploads.concat(files.map(function (file) {
    return {
      localId: 'p' + (uploadSeq++),
      file: file,
      url: URL.createObjectURL(file),
      caption: '',
      included: true,
    };
  }));
  uploadStage = 'review';
  renderUploadTab();
}

/* ───────────────── PDF manual crop ───────────────── */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function onPdfFilePicked(file) {
  if (!file) return;
  try {
    var buf = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
  } catch (e) {
    showToast('PDF를 여는 중 문제가 생겼어요');
    return;
  }
  pdfCurrentPage = 1;
  cropBounds = { x: 0.08, y: 0.08, width: 0.84, height: 0.3 };
  uploadStage = 'pdf-crop';
  await loadPdfPage();
  renderUploadTab();
}

function loadPdfPage() {
  return pdfDoc.getPage(pdfCurrentPage).then(function (page) {
    var viewport = page.getViewport({ scale: 1.6 });
    var canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    var ctx = canvas.getContext('2d');
    return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
      pdfPageImage = {
        dataUrl: canvas.toDataURL('image/jpeg', 0.9),
        width: canvas.width,
        height: canvas.height,
      };
    });
  });
}

function renderPdfCropStage(el) {
  if (!pdfPageImage) {
    el.innerHTML = '<div class="loading">페이지를 불러오는 중...</div>';
    return;
  }
  el.innerHTML =
    '<div class="pdf-nav">' +
      '<button onclick="pdfGoPage(-1)"' + (pdfCurrentPage <= 1 ? ' disabled' : '') + '>← 이전</button>' +
      '<span class="page-count">' + pdfCurrentPage + ' / ' + pdfDoc.numPages + '페이지</span>' +
      '<button onclick="pdfGoPage(1)"' + (pdfCurrentPage >= pdfDoc.numPages ? ' disabled' : '') + '>다음 →</button>' +
    '</div>' +
    '<div class="crop-stage" id="cropStage">' +
      '<img id="cropStageImg" src="' + pdfPageImage.dataUrl + '" alt="페이지" draggable="false">' +
      '<div class="crop-box" id="cropBox">' +
        '<div class="crop-handle" data-mode="nw"></div>' +
        '<div class="crop-handle" data-mode="ne"></div>' +
        '<div class="crop-handle" data-mode="sw"></div>' +
        '<div class="crop-handle" data-mode="se"></div>' +
      '</div>' +
    '</div>' +
    '<div class="crop-actions">' +
      '<button class="btn-primary" onclick="addCropRegion()">이 영역을 개념으로 담기</button>' +
      '<button class="btn-secondary" onclick="finishPdfCrop()">완료 — 검토 화면으로</button>' +
    '</div>' +
    '<p class="crop-count">지금까지 ' + pendingUploads.length + '개 담김</p>';
  updateCropBoxUI();
  wireCropBoxDrag();
}

function pdfGoPage(delta) {
  var next = pdfCurrentPage + delta;
  if (next < 1 || next > pdfDoc.numPages) return;
  pdfCurrentPage = next;
  cropBounds = { x: 0.08, y: 0.08, width: 0.84, height: 0.3 };
  pdfPageImage = null;
  renderUploadTab();
  loadPdfPage().then(renderUploadTab);
}

async function addCropRegion() {
  var blob = await cropToBlob(pdfPageImage, cropBounds);
  pendingUploads.push({
    localId: 'p' + (uploadSeq++),
    file: blob,
    url: URL.createObjectURL(blob),
    caption: '',
    included: true,
  });
  showToast('담았어요 (' + pendingUploads.length + '개)');
  // shift the box down as a starting guess for the next region on this page
  var nextY = Math.min(0.95 - cropBounds.height, cropBounds.y + cropBounds.height + 0.03);
  cropBounds = Object.assign({}, cropBounds, { y: Math.max(0, nextY) });
  updateCropBoxUI();
  document.querySelector('.crop-count').textContent = '지금까지 ' + pendingUploads.length + '개 담김';
}

function finishPdfCrop() {
  pdfDoc = null;
  pdfPageImage = null;
  uploadStage = pendingUploads.length > 0 ? 'review' : 'idle';
  renderUploadTab();
}

function cropToBlob(page, bounds) {
  return new Promise(function (resolve) {
    var img = new Image();
    img.onload = function () {
      var px = {
        x: Math.round(bounds.x * page.width),
        y: Math.round(bounds.y * page.height),
        w: Math.max(1, Math.round(bounds.width * page.width)),
        h: Math.max(1, Math.round(bounds.height * page.height)),
      };
      var canvas = document.createElement('canvas');
      canvas.width = px.w;
      canvas.height = px.h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, px.x, px.y, px.w, px.h, 0, 0, px.w, px.h);
      canvas.toBlob(function (blob) { resolve(blob); }, 'image/jpeg', 0.92);
    };
    img.src = page.dataUrl;
  });
}

function updateCropBoxUI() {
  var box = document.getElementById('cropBox');
  if (!box) return;
  box.style.left = (cropBounds.x * 100) + '%';
  box.style.top = (cropBounds.y * 100) + '%';
  box.style.width = (cropBounds.width * 100) + '%';
  box.style.height = (cropBounds.height * 100) + '%';
}

function wireCropBoxDrag() {
  var box = document.getElementById('cropBox');
  if (!box) return;

  function beginDrag(mode) {
    return function (e) {
      e.preventDefault();
      e.stopPropagation();
      cropDragMode = mode;
      cropDragStartX = e.clientX;
      cropDragStartY = e.clientY;
      cropDragStartBounds = Object.assign({}, cropBounds);
      window.addEventListener('pointermove', onCropDragMove);
      window.addEventListener('pointerup', onCropDragUp);
    };
  }

  box.onpointerdown = beginDrag('move');
  box.querySelectorAll('.crop-handle').forEach(function (h) {
    h.onpointerdown = beginDrag(h.dataset.mode);
  });
}

function onCropDragMove(e) {
  if (!cropDragMode) return;
  var stage = document.getElementById('cropStage');
  if (!stage) return;
  var rect = stage.getBoundingClientRect();
  var dx = (e.clientX - cropDragStartX) / rect.width;
  var dy = (e.clientY - cropDragStartY) / rect.height;
  var b = cropDragStartBounds;
  var clamp01 = function (n) { return Math.min(1, Math.max(0, n)); };
  var next = Object.assign({}, b);

  if (cropDragMode === 'move') {
    next.x = clamp01(b.x + dx);
    next.y = clamp01(b.y + dy);
  } else if (cropDragMode === 'se') {
    next.width = clamp01(b.x + b.width + dx) - b.x;
    next.height = clamp01(b.y + b.height + dy) - b.y;
  } else if (cropDragMode === 'nw') {
    var nx = clamp01(b.x + dx), ny = clamp01(b.y + dy);
    next.width = b.x + b.width - nx;
    next.height = b.y + b.height - ny;
    next.x = nx; next.y = ny;
  } else if (cropDragMode === 'ne') {
    var ny2 = clamp01(b.y + dy);
    next.width = clamp01(b.x + b.width + dx) - b.x;
    next.height = b.y + b.height - ny2;
    next.y = ny2;
  } else if (cropDragMode === 'sw') {
    var nx2 = clamp01(b.x + dx);
    next.width = b.x + b.width - nx2;
    next.height = clamp01(b.y + b.height + dy) - b.y;
    next.x = nx2;
  }

  next.width = Math.max(0.03, Math.min(next.width, 1 - next.x));
  next.height = Math.max(0.03, Math.min(next.height, 1 - next.y));
  cropBounds = next;
  updateCropBoxUI();
}

function onCropDragUp() {
  cropDragMode = null;
  window.removeEventListener('pointermove', onCropDragMove);
  window.removeEventListener('pointerup', onCropDragUp);
}

function resetUploadFlow() {
  uploadStage = 'idle';
  pendingUploads = [];
  savedCount = 0;
  renderUploadTab();
}

async function saveAllUploads() {
  if (!assets || !db) { showToast('저장 기능을 사용할 수 없어요'); return; }
  uploadStage = 'saving';
  renderUploadTab();
  var toSave = pendingUploads.filter(function (i) { return i.included; });
  var count = 0;
  for (var i = 0; i < toSave.length; i++) {
    var item = toSave[i];
    try {
      var up = await assets.upload(item.file);
      await db.collection('concepts').add({
        text: item.caption || '',
        subjectId: uploadSubject,
        imageId: up.id,
        easeFactor: DEFAULT_EASE,
        intervalDays: 1,
        nextReviewDate: new Date().toISOString(),
        createdAt: new Date().toISOString(),
        lastReviewedAt: null,
      });
      count++;
    } catch (e) {}
  }
  savedCount = count;
  uploadStage = 'done';
  reviewQueue = null; // force the review tab to refetch and include today's new concepts
  allConcepts = null;
  renderUploadTab();
}

/* ───────────────── concepts tab (모아보기) ───────────────── */

async function renderConceptsTab() {
  var el = document.getElementById('content');
  if (!db) {
    el.innerHTML = '<div class="empty-state">' + ICONS.empty + '<p>데이터 저장 기능을 사용할 수 없어요.</p></div>';
    return;
  }
  if (allConcepts === null) {
    el.innerHTML = '<div class="loading">불러오는 중...</div>';
    try {
      var snap = await db.collection('concepts').limit(1000).get();
      allConcepts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      allConcepts.sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
    } catch (e) {
      allConcepts = [];
    }
  }
  if (currentTab !== 'concepts') return;

  el.innerHTML =
    '<div class="subject-filter"><select id="subjectFilterSelect">' +
      '<option value="">전체 과목</option>' +
      SUBJECTS.map(function (s) {
        return '<option value="' + s.id + '"' + (s.id === conceptsSubjectFilter ? ' selected' : '') + '>' + s.name + '</option>';
      }).join('') +
    '</select></div><div id="galleryResults"></div>';
  document.getElementById('subjectFilterSelect').addEventListener('change', function (e) {
    conceptsSubjectFilter = e.target.value;
    renderGalleryResults();
  });
  renderGalleryResults();
}

function renderGalleryResults() {
  var resultsEl = document.getElementById('galleryResults');
  if (!resultsEl) return;
  var filtered = conceptsSubjectFilter
    ? allConcepts.filter(function (c) { return c.subjectId === conceptsSubjectFilter; })
    : allConcepts;

  if (filtered.length === 0) {
    resultsEl.innerHTML = '<div class="empty-state">' + ICONS.empty + '<p>저장된 개념이 없어요.</p></div>';
    return;
  }
  resultsEl.innerHTML = '<div class="gallery-grid">' + filtered.map(function (c) {
    var url = c.imageId ? ('/_blob/' + c.imageId) : '';
    return '<div class="gallery-item">' +
      '<div class="accent-stripe" style="background:' + subjectGradient(c.subjectId) + '"></div>' +
      (url ? '<img src="' + url + '" alt="개념" onclick="openLightbox(\'' + url + '\')">' : '') +
      '<div class="g-body">' +
        '<div class="g-top">' + subjectEditor(c.id, c.subjectId) +
          '<button class="btn-icon" onclick="deleteConcept(\'' + c.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg></button>' +
        '</div>' +
        (editingConceptId === c.id
          ? '<textarea class="g-caption-edit" onblur="saveEditCaption(\'' + c.id + '\', this.value)">' + escapeHtml(c.text || '') + '</textarea>'
          : '<div class="g-caption" onclick="startEditCaption(\'' + c.id + '\')">' + (c.text ? escapeHtml(c.text) : '메모 추가...') + '</div>') +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

async function deleteConcept(id) {
  var concept = allConcepts.find(function (c) { return c.id === id; });
  if (!concept) return;
  try {
    if (assets && concept.imageId) await assets.delete(concept.imageId);
    await db.doc('concepts/' + id).delete();
  } catch (e) {}
  allConcepts = allConcepts.filter(function (c) { return c.id !== id; });
  reviewQueue = null;
  renderGalleryResults();
}

initCapabilities();
